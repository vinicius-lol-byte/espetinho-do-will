<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pedidos - Espetinho do Will</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 25px;
        }

        .caixa {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        select,
        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 18px;
            margin-top: 5px;
            margin-right: 5px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .adicionar {
            background: #333;
            color: white;
        }

        .enviar {
            background: #198754;
            color: white;
            font-size: 18px;
        }

        .fechar {
            background: #dc3545;
            color: white;
        }

        .voltar {
            background: #222;
            color: white;
            margin-bottom: 20px;
        }

        .item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
        }

        .mesa-aberta {
            border-left: 6px solid #198754;
        }

        .total {
            background: white;
            padding: 20px;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        .pagamento {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border-left: 6px solid #ffc107;
        }

        .pagamento button {
            width: 100%;
            margin-top: 10px;
        }

        .dinheiro {
            background: #198754;
            color: white;
        }

        .cartao {
            background: #0d6efd;
            color: white;
        }

        .pix {
            background: #6f42c1;
            color: white;
        }

        .conta-cliente {
            background: #fd7e14;
            color: white;
        }

        .cancelar {
            background: #6c757d;
            color: white;
        }

        .selecionar-cliente {
            background: #fff3cd;
            border: 1px solid #ffe69c;
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .confirmar-conta {
            background: #fd7e14;
            color: white;
            width: 100%;
        }

        /* =========================================
           COMPROVANTE PDF
        ========================================= */

        .comprovante-area {
            background: #d1e7dd;
            border-left: 6px solid #198754;
            padding: 20px;
            border-radius: 10px;
            margin: 25px 0;
        }

        .comprovante-area h2 {
            margin-top: 0;
        }

        .baixar-pdf {
            background: #198754;
            color: white;
            width: 100%;
            font-size: 18px;
        }

        .fechamento {
            background: #0d6efd;
            color: white;
            font-size: 18px;
        }

        .fechamento-dia {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .lucro {
            font-size: 24px;
            font-weight: bold;
        }

        @media (max-width: 700px) {

            .container {
                padding: 15px;
            }

            button {
                width: 100%;
                margin-right: 0;
            }

        }

    </style>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- JSPDF -->

    <script
        src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"
    ></script>


    <script src="supabase.js"></script>

</head>


<body>


<header>

    <h1>🥩 Espetinho do Will</h1>

    <p>📝 Pedidos</p>

</header>


<div class="container">


    <button
        class="voltar"
        onclick="voltarMenu()"
    >
        🏠 Voltar ao menu
    </button>



    <!-- =========================================
         NOVO PEDIDO
    ========================================== -->

    <div class="caixa">

        <h2>Novo pedido</h2>


        <label>Mesa:</label>

        <select id="mesa">

            <option value="">
                Selecione a mesa
            </option>

        </select>


        <label>Produto:</label>

        <select id="produto">

            <option value="">
                Carregando produtos...
            </option>

        </select>


        <label>Quantidade:</label>

        <input
            type="number"
            id="quantidade"
            min="1"
            placeholder="Digite a quantidade"
        >


        <button
            class="adicionar"
            onclick="adicionarItem()"
        >
            ➕ Adicionar item
        </button>

    </div>



    <!-- =========================================
         ITENS DO PEDIDO
    ========================================== -->

    <h2>Itens do pedido</h2>


    <div id="listaPedido">

        <p>Nenhum item adicionado.</p>

    </div>


    <div
        id="totalPedido"
        class="total"
        style="display:none;"
    >
        Total: R$ 0,00
    </div>


    <button
        id="botaoEnviar"
        class="enviar"
        onclick="enviarPedido()"
        style="display:none;"
    >
        ✅ Enviar pedido
    </button>



    <!-- =========================================
         MESAS ABERTAS
    ========================================== -->

    <h2>Mesas abertas</h2>


    <div id="mesasAbertas">

        <p>Nenhuma mesa aberta.</p>

    </div>



    <!-- =========================================
         COMPROVANTE
    ========================================== -->

    <div
        id="areaComprovante"
        class="comprovante-area"
        style="display:none;"
    >

        <h2>
            🧾 Comprovante disponível
        </h2>

        <p id="textoComprovante">
            Mesa fechada com sucesso.
        </p>

        <button
            class="baixar-pdf"
            onclick="baixarUltimoComprovante()"
        >
            📄 Baixar PDF
        </button>

    </div>



    <!-- =========================================
         FECHAMENTO
    ========================================== -->

    <h2>📊 Fechamento diário</h2>


    <button
        class="fechamento"
        onclick="fecharDia()"
    >
        💰 Fechar o dia
    </button>


    <div
        id="resultadoFechamento"
        class="fechamento-dia"
        style="display:none;"
    >
    </div>


</div>



<script>


/* =====================================================
   LOGIN
===================================================== */

var usuarioLogado =
    localStorage.getItem(
        "usuarioLogado"
    );


if (!usuarioLogado) {

    window.location.href =
        "login.html";

}



/* =====================================================
   VARIÁVEIS
===================================================== */

var pedido = [];

var mesasAbertas = [];

var vendasDoDia = [];

var produtosDisponiveis = [];

var pagamentoEmAndamento =
    false;


/*
   Guarda os dados da última mesa fechada
   para gerar o PDF.
*/

var ultimoComprovante =
    null;



/* =====================================================
   CRIAR MESAS 0 ATÉ 56
===================================================== */

function carregarNumeroMesas() {

    var select =
        document.getElementById(
            "mesa"
        );


    select.innerHTML =

        "<option value=''>" +

        "Selecione a mesa" +

        "</option>";


    for (
        var i = 0;
        i <= 56;
        i++
    ) {

        var option =
            document.createElement(
                "option"
            );


        option.value =
            String(i);


        option.textContent =
            "Mesa " + i;


        select.appendChild(
            option
        );

    }

}



/* =====================================================
   DATA ISO
===================================================== */

function obterDataISO() {

    var agora =
        new Date();


    var ano =
        agora.getFullYear();


    var mes =
        String(
            agora.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    var dia =
        String(
            agora.getDate()
        ).padStart(
            2,
            "0"
        );


    return (

        ano +

        "-" +

        mes +

        "-" +

        dia

    );

}



/* =====================================================
   DATA BRASILEIRA
===================================================== */

function obterDataBrasil() {

    var agora =
        new Date();


    var dia =
        String(
            agora.getDate()
        ).padStart(
            2,
            "0"
        );


    var mes =
        String(
            agora.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    var ano =
        agora.getFullYear();


    return (

        dia +

        "/" +

        mes +

        "/" +

        ano

    );

}



/* =====================================================
   HORA
===================================================== */

function obterHorario() {

    var agora =
        new Date();


    return agora.toLocaleTimeString(

        "pt-BR",

        {
            hour:
                "2-digit",

            minute:
                "2-digit"
        }

    );

}



/* =====================================================
   FORMATAR MOEDA
===================================================== */

function formatarMoeda(
    valor
) {

    return Number(
        valor || 0
    ).toLocaleString(

        "pt-BR",

        {
            style:
                "currency",

            currency:
                "BRL"
        }

    );

}



/* =====================================================
   SALVAR MESAS
===================================================== */

function salvarMesasAbertas() {

    localStorage.setItem(

        "mesasAbertas",

        JSON.stringify(
            mesasAbertas
        )

    );

}



/* =====================================================
   CARREGAR MESAS
===================================================== */

function carregarMesasAbertas() {

    var dados =
        localStorage.getItem(
            "mesasAbertas"
        );


    if (!dados) {

        mesasAbertas = [];

        return;

    }


    try {

        mesasAbertas =
            JSON.parse(
                dados
            );


        if (
            !Array.isArray(
                mesasAbertas
            )
        ) {

            mesasAbertas = [];

        }

    }

    catch (erro) {

        mesasAbertas = [];

    }

}



/* =====================================================
   VOLTAR
===================================================== */

function voltarMenu() {

    salvarMesasAbertas();


    window.location.href =
        "index.html";

}



/* =====================================================
   CARREGAR PRODUTOS
===================================================== */

async function carregarProdutos() {

    var select =
        document.getElementById(
            "produto"
        );


    select.innerHTML =

        "<option value=''>" +

        "Carregando produtos..." +

        "</option>";


    try {

        var resultado =
            await window.supabaseClient
                .from(
                    "produtos"
                )
                .select(
                    "*"
                )
                .order(
                    "nome",
                    {
                        ascending:
                            true
                    }
                );


        if (
            resultado.error
        ) {

            throw resultado.error;

        }


        produtosDisponiveis =
            resultado.data || [];


        select.innerHTML =

            "<option value=''>" +

            "Selecione o produto" +

            "</option>";


        for (
            var i = 0;
            i < produtosDisponiveis.length;
            i++
        ) {

            var produto =
                produtosDisponiveis[i];


            var option =
                document.createElement(
                    "option"
                );


            option.value =
                produto.id;


            option.textContent =

                produto.nome +

                " — Estoque: " +

                produto.quantidade;


            select.appendChild(
                option
            );

        }

    }

    catch (erro) {

        console.error(
            erro
        );


        select.innerHTML =

            "<option value=''>" +

            "Erro ao carregar produtos" +

            "</option>";

    }

}



/* =====================================================
   LOCALIZAR PRODUTO
===================================================== */

function obterProdutoPorId(
    id
) {

    for (
        var i = 0;
        i < produtosDisponiveis.length;
        i++
    ) {

        if (
            String(
                produtosDisponiveis[i].id
            )
            ===
            String(id)
        ) {

            return produtosDisponiveis[i];

        }

    }


    return null;

}



/* =====================================================
   ADICIONAR ITEM
===================================================== */

function adicionarItem() {

    var mesa =
        document.getElementById(
            "mesa"
        ).value;


    var produtoId =
        document.getElementById(
            "produto"
        ).value;


    var quantidade =
        Number(
            document.getElementById(
                "quantidade"
            ).value
        );


    if (
        mesa === ""
    ) {

        alert(
            "Escolha uma mesa."
        );

        return;

    }


    if (
        produtoId === ""
    ) {

        alert(
            "Escolha um produto."
        );

        return;

    }


    if (
        !Number.isFinite(
            quantidade
        )
        ||
        quantidade <= 0
    ) {

        alert(
            "Digite uma quantidade válida."
        );

        return;

    }


    var produto =
        obterProdutoPorId(
            produtoId
        );


    if (!produto) {

        alert(
            "Produto não encontrado."
        );

        return;

    }


    /*
       Ver quanto do mesmo produto
       já está no pedido.
    */

    var quantidadeNoPedido =
        0;


    for (
        var i = 0;
        i < pedido.length;
        i++
    ) {

        if (
            String(
                pedido[i].produtoId
            )
            ===
            String(
                produto.id
            )
        ) {

            quantidadeNoPedido +=

                Number(
                    pedido[i].quantidade
                );

        }

    }


    if (
        quantidadeNoPedido +
        quantidade >
        Number(
            produto.quantidade
        )
    ) {

        alert(

            "Estoque insuficiente para " +

            produto.nome +

            ".\n\nDisponível: " +

            produto.quantidade

        );

        return;

    }


    pedido.push({

        mesa:
            mesa,

        produtoId:
            produto.id,

        nome:
            produto.nome,

        quantidade:
            quantidade,

        custo:
            Number(
                produto.custo || 0
            ),

        venda:
            Number(
                produto.venda || 0
            )

    });


    mostrarPedido();


    document.getElementById(
        "quantidade"
    ).value =
        "";

}



/* =====================================================
   MOSTRAR PEDIDO
===================================================== */

function mostrarPedido() {

    var lista =
        document.getElementById(
            "listaPedido"
        );


    lista.innerHTML =
        "";


    if (
        pedido.length === 0
    ) {

        lista.innerHTML =

            "<p>" +

            "Nenhum item adicionado." +

            "</p>";


        document.getElementById(
            "totalPedido"
        ).style.display =
            "none";


        document.getElementById(
            "botaoEnviar"
        ).style.display =
            "none";


        return;

    }


    var total =
        0;


    for (
        var i = 0;
        i < pedido.length;
        i++
    ) {

        var item =
            pedido[i];


        var subtotal =

            Number(
                item.quantidade
            )

            *

            Number(
                item.venda || 0
            );


        total +=
            subtotal;


        lista.innerHTML +=

            "<div class='item'>" +

            "<strong>🍽️ Mesa " +

            item.mesa +

            "</strong>" +

            "<p>" +

            escaparHTML(
                item.nome
            ) +

            " × " +

            item.quantidade +

            "</p>" +

            "<p>" +

            formatarMoeda(
                subtotal
            ) +

            "</p>" +

            "</div>";

    }


    document.getElementById(
        "totalPedido"
    ).innerText =

        "Total: " +

        formatarMoeda(
            total
        );


    document.getElementById(
        "totalPedido"
    ).style.display =
        "block";


    document.getElementById(
        "botaoEnviar"
    ).style.display =
        "inline-block";

}



/* =====================================================
   ENVIAR PEDIDO
===================================================== */

async function enviarPedido() {

    if (
        pedido.length === 0
    ) {

        alert(
            "Nenhum item no pedido."
        );

        return;

    }


    try {


        /*
           VALIDAR ESTOQUE
        */

        for (
            var i = 0;
            i < pedido.length;
            i++
        ) {

            var item =
                pedido[i];


            var consulta =
                await window.supabaseClient
                    .from(
                        "produtos"
                    )
                    .select(
                        "*"
                    )
                    .eq(
                        "id",
                        item.produtoId
                    )
                    .single();


            if (
                consulta.error
            ) {

                throw consulta.error;

            }


            if (
                Number(
                    item.quantidade
                )
                >
                Number(
                    consulta.data.quantidade
                )
            ) {

                alert(

                    "Estoque insuficiente para " +

                    consulta.data.nome

                );


                await carregarProdutos();


                return;

            }

        }



        /*
           BAIXAR ESTOQUE
        */

        for (
            var i = 0;
            i < pedido.length;
            i++
        ) {

            var item =
                pedido[i];


            var consulta =
                await window.supabaseClient
                    .from(
                        "produtos"
                    )
                    .select(
                        "quantidade"
                    )
                    .eq(
                        "id",
                        item.produtoId
                    )
                    .single();


            if (
                consulta.error
            ) {

                throw consulta.error;

            }


            var novoEstoque =

                Number(
                    consulta.data.quantidade
                )

                -

                Number(
                    item.quantidade
                );


            var atualizar =
                await window.supabaseClient
                    .from(
                        "produtos"
                    )
                    .update({

                        quantidade:
                            novoEstoque

                    })
                    .eq(
                        "id",
                        item.produtoId
                    );


            if (
                atualizar.error
            ) {

                throw atualizar.error;

            }

        }



        /*
           COLOCAR NA MESA
        */

        for (
            var i = 0;
            i < pedido.length;
            i++
        ) {

            mesasAbertas.push({

                mesa:
                    pedido[i].mesa,

                produtoId:
                    pedido[i].produtoId,

                nome:
                    pedido[i].nome,

                quantidade:
                    pedido[i].quantidade,

                custo:
                    pedido[i].custo,

                venda:
                    pedido[i].venda

            });

        }


        salvarMesasAbertas();


        pedido =
            [];


        mostrarPedido();


        mostrarMesasAbertas();


        document.getElementById(
            "mesa"
        ).value =
            "";


        document.getElementById(
            "produto"
        ).value =
            "";


        document.getElementById(
            "quantidade"
        ).value =
            "";


        await carregarProdutos();


        alert(
            "Pedido enviado com sucesso!"
        );

    }

    catch (erro) {

        console.error(
            erro
        );


        alert(

            "Não foi possível enviar o pedido.\n\n" +

            (
                erro.message ||
                "Erro desconhecido."
            )

        );

    }

}



/* =====================================================
   MOSTRAR MESAS
===================================================== */

function mostrarMesasAbertas() {

    var area =
        document.getElementById(
            "mesasAbertas"
        );


    area.innerHTML =
        "";


    if (
        mesasAbertas.length === 0
    ) {

        area.innerHTML =

            "<p>" +

            "Nenhuma mesa aberta." +

            "</p>";

        return;

    }


    var numeros =
        [];


    for (
        var i = 0;
        i < mesasAbertas.length;
        i++
    ) {

        var numero =
            String(
                mesasAbertas[i].mesa
            );


        if (
            numeros.indexOf(
                numero
            )
            === -1
        ) {

            numeros.push(
                numero
            );

        }

    }


    numeros.sort(

        function(a, b) {

            return Number(a) - Number(b);

        }

    );


    for (
        var i = 0;
        i < numeros.length;
        i++
    ) {

        var mesaAtual =
            numeros[i];


        var total =
            0;


        var itens =
            [];


        for (
            var j = 0;
            j < mesasAbertas.length;
            j++
        ) {

            if (
                String(
                    mesasAbertas[j].mesa
                )
                ===
                String(
                    mesaAtual
                )
            ) {

                itens.push(
                    mesasAbertas[j]
                );


                total +=

                    Number(
                        mesasAbertas[j].quantidade
                    )

                    *

                    Number(
                        mesasAbertas[j].venda || 0
                    );

            }

        }


        var html =

            "<div class='item mesa-aberta'>" +

            "<h3>🍽️ Mesa " +

            mesaAtual +

            "</h3>";


        for (
            var k = 0;
            k < itens.length;
            k++
        ) {

            var subtotal =

                Number(
                    itens[k].quantidade
                )

                *

                Number(
                    itens[k].venda || 0
                );


            html +=

                "<p>" +

                escaparHTML(
                    itens[k].nome
                ) +

                " × " +

                itens[k].quantidade +

                " — " +

                formatarMoeda(
                    subtotal
                ) +

                "</p>";

        }


        html +=

            "<p><strong>Total: " +

            formatarMoeda(
                total
            ) +

            "</strong></p>" +


            "<button " +

            "class='fechar' " +

            "onclick='fecharMesa(\"" +

            mesaAtual +

            "\")'>" +

            "💰 Fechar mesa" +

            "</button>" +


            "</div>";


        area.innerHTML +=
            html;

    }

}



/* =====================================================
   CALCULAR TOTAL MESA
===================================================== */

function calcularTotalMesa(
    mesa
) {

    var total =
        0;


    for (
        var i = 0;
        i < mesasAbertas.length;
        i++
    ) {

        if (
            String(
                mesasAbertas[i].mesa
            )
            ===
            String(mesa)
        ) {

            total +=

                Number(
                    mesasAbertas[i].quantidade
                )

                *

                Number(
                    mesasAbertas[i].venda || 0
                );

        }

    }


    return total;

}

/* =====================================================
   PAGAMENTO NORMAL
===================================================== */

async function confirmarPagamento(
    mesa,
    formaPagamento
) {

    if (
        pagamentoEmAndamento
    ) {

        return;

    }


    pagamentoEmAndamento =
        true;


    try {

        var itensFechados =
            [];


        var totalMesa =
            0;


        var custoMesa =
            0;


        for (
            var i = 0;
            i < mesasAbertas.length;
            i++
        ) {

            if (
                String(
                    mesasAbertas[i].mesa
                )
                ===
                String(mesa)
            ) {

                var item =
                    mesasAbertas[i];


                var quantidade =
                    Number(
                        item.quantidade
                    );


                var valorVenda =
                    Number(
                        item.venda || 0
                    );


                var custo =
                    Number(
                        item.custo || 0
                    );


                totalMesa +=

                    quantidade *

                    valorVenda;


                custoMesa +=

                    quantidade *

                    custo;


                itensFechados.push({

                    produtoId:
                        item.produtoId,

                    nome:
                        item.nome,

                    quantidade:
                        quantidade,

                    custo:
                        custo,

                    venda:
                        valorVenda

                });

            }

        }


        if (
            itensFechados.length === 0
        ) {

            throw new Error(
                "Nenhum item encontrado na mesa."
            );

        }


        var horario =
            obterHorario();


        /*
           CRIAR VENDA
        */

        var resultadoVenda =
            await window.supabaseClient
                .from(
                    "vendas"
                )
                .insert({

                    mesa:
                        String(
                            mesa
                        ),

                    horario:
                        horario,

                    data_venda:
                        obterDataISO(),

                    total:
                        totalMesa,

                    custo:
                        custoMesa,

                    forma_pagamento:
                        formaPagamento

                })
                .select(
                    "id"
                )
                .single();


        if (
            resultadoVenda.error
        ) {

            throw resultadoVenda.error;

        }


        var vendaId =
            resultadoVenda.data.id;



        /*
           GRAVAR ITENS
        */

        var itensBanco =
            [];


        for (
            var i = 0;
            i < itensFechados.length;
            i++
        ) {

            itensBanco.push({

                venda_id:
                    vendaId,

                produto_id:
                    itensFechados[i].produtoId,

                nome_produto:
                    itensFechados[i].nome,

                quantidade:
                    itensFechados[i].quantidade,

                custo_unitario:
                    itensFechados[i].custo,

                venda_unitaria:
                    itensFechados[i].venda

            });

        }


        var resultadoItens =
            await window.supabaseClient
                .from(
                    "itens_venda"
                )
                .insert(
                    itensBanco
                );


        if (
            resultadoItens.error
        ) {

            /*
               Remove a venda se os itens
               não forem gravados.
            */

            await window.supabaseClient
                .from(
                    "vendas"
                )
                .delete()
                .eq(
                    "id",
                    vendaId
                );


            throw resultadoItens.error;

        }



        /*
           SALVAR NO FECHAMENTO LOCAL
        */

        vendasDoDia.push({

            id:
                vendaId,

            mesa:
                mesa,

            horario:
                horario,

            total:
                totalMesa,

            custo:
                custoMesa,

            formaPagamento:
                formaPagamento,

            itens:
                itensFechados

        });


        salvarVendasDoDia();



        /*
           PREPARAR COMPROVANTE
        */

        ultimoComprovante = {

            mesa:
                mesa,

            data:
                obterDataBrasil(),

            horario:
                horario,

            itens:
                itensFechados,

            total:
                totalMesa,

            formaPagamento:
                formaPagamento

        };



        /*
           LIBERAR MESA
        */

        removerMesaAberta(
            mesa
        );



        /*
           MOSTRAR BOTÃO PDF
        */

        mostrarComprovante();



        alert(

            "✅ Mesa " +

            mesa +

            " fechada com sucesso!\n\n" +

            "Pagamento: " +

            formaPagamento +

            "\nTotal: " +

            formatarMoeda(
                totalMesa
            ) +

            "\n\nO comprovante está disponível abaixo."

        );



        /*
           ROLAR ATÉ O BOTÃO
        */

        setTimeout(
            function() {

                var area =
                    document.getElementById(
                        "areaComprovante"
                    );


                if (area) {

                    area.scrollIntoView({

                        behavior:
                            "smooth",

                        block:
                            "center"

                    });

                }

            },
            300
        );

    }

    catch (erro) {

        console.error(
            erro
        );


        alert(

            "❌ Não foi possível fechar a mesa.\n\n" +

            (
                erro.message ||
                "Erro desconhecido."
            )

        );

    }

    finally {

        pagamentoEmAndamento =
            false;

    }

}



/* =====================================================
   MOSTRAR COMPROVANTE
===================================================== */

function mostrarComprovante() {

    if (

        return;

}



/* =====================================================
   BAIXAR PDF 80 MM
===================================================== */

function baixarUltimoComprovante() {

    if (
        !ultimoComprovante
    ) {

        alert(
            "Nenhum comprovante disponível."
        );

        return;

    }


    if (
        !window.jspdf ||
        !window.jspdf.jsPDF
    ) {

        alert(

            "Não foi possível carregar o gerador de PDF.\n\n" +

            "Atualize a página e tente novamente."

        );

        return;

    }


    var dados =
        ultimoComprovante;


    /*
       80 mm de largura.
       A altura aumenta conforme
       a quantidade de itens.
    */

    var altura =

        75 +

        (
            dados.itens.length *
            15
        );


    if (
        altura < 110
    ) {

        altura =
            110;

    }


    var jsPDF =
        window.jspdf.jsPDF;


    var pdf =
        new jsPDF({

            orientation:
                "portrait",

            unit:
                "mm",

            format:
                [
                    80,
                    altura
                ]

        });


    var largura =
        80;


    var y =
        10;



    /* =========================================
       ESPETINHO DO WILL
    ========================================= */

    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.setFontSize(
        14
    );


    pdf.text(

        "ESPETINHO DO WILL",

        largura / 2,

        y,

        {
            align:
                "center"
        }

    );


    y +=
        10;



    /* =========================================
       DADOS
    ========================================= */

    pdf.setFont(
        "helvetica",
        "normal"
    );


    pdf.setFontSize(
        10
    );


    pdf.text(
        "Mesa " +
        String(
            dados.mesa
        ),
        5,
        y
    );


    y +=
        5;


    pdf.text(
        "Data: " +
        dados.data,
        5,
        y
    );


    y +=
        5;


    pdf.text(
        "Horario: " +
        dados.horario,
        5,
        y
    );


    y +=
        7;



    /*
       LINHA
    */

    pdf.line(
        5,
        y,
        75,
        y
    );


    y +=
        8;



    /* =========================================
       PRODUTOS
    ========================================= */

    for (
        var i = 0;
        i < dados.itens.length;
        i++
    ) {

        var item =
            dados.itens[i];


        pdf.setFont(
            "helvetica",
            "bold"
        );


        var descricao =
            String(
                item.quantidade
            )
            +
            "x "
            +
            String(
                item.nome
            );


        var linhas =
            pdf.splitTextToSize(

                descricao,

                68

            );


        pdf.text(
            linhas,
            5,
            y
        );


        y +=

            linhas.length *

            4.5;


        pdf.setFont(
            "helvetica",
            "normal"
        );


        pdf.text(

            "Unitario: " +

            formatarMoedaPDF(
                item.venda
            ),

            5,

            y

        );


        y +=
            9;

    }



    /* =========================================
       LINHA
    ========================================= */

    pdf.line(
        5,
        y,
        75,
        y
    );


    y +=
        9;



    /* =========================================
       TOTAL
    ========================================= */

    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.setFontSize(
        13
    );


    pdf.text(

        "TOTAL: " +

        formatarMoedaPDF(
            dados.total
        ),

        5,

        y

    );


    y +=
        9;



    /* =========================================
       PAGAMENTO
    ========================================= */

    pdf.setFont(
        "helvetica",
        "normal"
    );


    pdf.setFontSize(
        10
    );


    pdf.text(

        "Pagamento: " +

        String(
            dados.formaPagamento
        ),

        5,

        y

    );



    /* =========================================
       BAIXAR
    ========================================= */

    var nomeArquivo =

        "mesa-" +

        dados.mesa +

        "-" +

        obterDataISO() +

        ".pdf";


    pdf.save(
        nomeArquivo
    );

}



/* =====================================================
   MOEDA PARA PDF
===================================================== */

function formatarMoedaPDF(
    valor
) {

    return (

        "R$ " +

        Number(
            valor || 0
        )
        .toFixed(
            2
        )
        .replace(
            ".",
            ","
        )

    );

}



/* =====================================================
   REMOVER MESA
===================================================== */

function removerMesaAberta(
    mesa
) {

    var novas =
        [];


    for (
        var i = 0;
        i < mesasAbertas.length;
        i++
    ) {

        if (
            String(
                mesasAbertas[i].mesa
            )
            !==
            String(mesa)
        ) {

            novas.push(
                mesasAbertas[i]
            );

        }

    }


    mesasAbertas =
        novas;


    salvarMesasAbertas();


    mostrarMesasAbertas();

}



/* =====================================================
   CANCELAR
===================================================== */

function cancelarPagamento() {

    mostrarMesasAbertas();

}



/* =====================================================
   VENDAS DO DIA LOCAL STORAGE
===================================================== */

function obterDataLocalStorage() {

    var agora =
        new Date();


    var dia =
        String(
            agora.getDate()
        ).padStart(
            2,
            "0"
        );


    var mes =
        String(
            agora.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    var ano =
        agora.getFullYear();


    return (

        dia +

        "-" +

        mes +

        "-" +

        ano

    );

}



function salvarVendasDoDia() {

    localStorage.setItem(

        "vendas_" +

        obterDataLocalStorage(),

        JSON.stringify(
            vendasDoDia
        )

    );

}



function carregarVendasDoDia() {

    var dados =
        localStorage.getItem(

            "vendas_" +

            obterDataLocalStorage()

        );


    if (!dados) {

        vendasDoDia = [];

        return;

    }


    try {

        vendasDoDia =
            JSON.parse(
                dados
            );


        if (
            !Array.isArray(
                vendasDoDia
            )
        ) {

            vendasDoDia = [];

        }

    }

    catch (erro) {

        vendasDoDia = [];

    }

}



/* =====================================================
   FECHAR DIA
===================================================== */

function fecharDia() {

    if (
        mesasAbertas.length > 0
    ) {

        alert(

            "Ainda existem mesas abertas.\n\n" +

            "Feche todas antes do fechamento."

        );

        return;

    }


    if (
        vendasDoDia.length === 0
    ) {

        alert(
            "Ainda não existem vendas pagas hoje."
        );

        return;

    }


    var total =
        0;


    var custo =
        0;


    var dinheiro =
        0;


    var cartao =
        0;


    var pix =
        0;


    for (
        var i = 0;
        i < vendasDoDia.length;
        i++
    ) {

        var venda =
            vendasDoDia[i];


        total +=

            Number(
                venda.total || 0
            );


        custo +=

            Number(
                venda.custo || 0
            );


        if (
            venda.formaPagamento ===
            "Dinheiro"
        ) {

            dinheiro +=

                Number(
                    venda.total || 0
                );

        }


        else if (
            venda.formaPagamento ===
            "Cartão"
        ) {

            cartao +=

                Number(
                    venda.total || 0
                );

        }


        else if (
            venda.formaPagamento ===
            "PIX"
        ) {

            pix +=

                Number(
                    venda.total || 0
                );

        }

    }


    var lucro =
        total -
        custo;


    var html =

        "<h2>📊 Fechamento do dia</h2>" +

        "<p><strong>Data:</strong> " +

        obterDataBrasil() +

        "</p>" +

        "<hr>" +

        "<p><strong>Total recebido:</strong> " +

        formatarMoeda(
            total
        ) +

        "</p>" +

        "<p><strong>Custo:</strong> " +

        formatarMoeda(
            custo
        ) +

        "</p>" +

        "<p class='lucro'>📈 Lucro: " +

        formatarMoeda(
            lucro
        ) +

        "</p>" +

        "<hr>" +

        "<p>💵 Dinheiro: " +

        formatarMoeda(
            dinheiro
        ) +

        "</p>" +

        "<p>💳 Cartão: " +

        formatarMoeda(
            cartao
        ) +

        "</p>" +

        "<p>📱 PIX: " +

        formatarMoeda(
            pix
        ) +

        "</p>";


    document.getElementById(
        "resultadoFechamento"
    ).innerHTML =
        html;


    document.getElementById(
        "resultadoFechamento"
    ).style.display =
        "block";

}



/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(
    texto
) {

    return String(
        texto || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
