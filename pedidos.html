<script>


/* =====================================================
   LOGIN
===================================================== */

var usuarioLogado =
    localStorage.getItem(
        "usuarioLogado"
    );


if (!usuarioLogado) {

    window.location.href =
        "login.html";

}


/* =====================================================
   VARIÁVEIS
===================================================== */

var pedido = [];

var mesasAbertas = [];

var vendasDoDia = [];

var produtosDisponiveis = [];

var pagamentoEmAndamento = false;


/* =====================================================
   SALVAR MESAS
===================================================== */

function salvarMesasAbertas() {

    localStorage.setItem(

        "mesasAbertas",

        JSON.stringify(
            mesasAbertas
        )

    );

}


/* =====================================================
   CARREGAR MESAS
===================================================== */

function carregarMesasAbertas() {

    var dados =
        localStorage.getItem(
            "mesasAbertas"
        );


    if (!dados) {

        mesasAbertas = [];

        return;

    }


    try {

        mesasAbertas =
            JSON.parse(
                dados
            );


        if (
            !Array.isArray(
                mesasAbertas
            )
        ) {

            mesasAbertas = [];

        }

    }

    catch (erro) {

        mesasAbertas = [];

    }

}


/* =====================================================
   VOLTAR
===================================================== */

function voltarMenu() {

    salvarMesasAbertas();

    window.location.href =
        "index.html";

}


/* =====================================================
   CARREGAR PRODUTOS
===================================================== */

async function carregarProdutos() {

    var select =
        document.getElementById(
            "produto"
        );


    select.innerHTML =

        "<option value=''>" +

        "Carregando produtos..." +

        "</option>";


    try {

        var resultado =
            await window.supabaseClient
                .from("produtos")
                .select("*")
                .order(
                    "nome",
                    {
                        ascending: true
                    }
                );


        if (resultado.error) {

            throw resultado.error;

        }


        produtosDisponiveis =
            resultado.data || [];


        select.innerHTML =

            "<option value=''>" +

            "Selecione o produto" +

            "</option>";


        for (
            var i = 0;
            i < produtosDisponiveis.length;
            i++
        ) {

            var produto =
                produtosDisponiveis[i];


            var option =
                document.createElement(
                    "option"
                );


            option.value =
                produto.id;


            option.textContent =

                produto.nome +

                " — Estoque: " +

                produto.quantidade;


            select.appendChild(
                option
            );

        }

    }

    catch (erro) {

        console.error(
            erro
        );


        select.innerHTML =

            "<option value=''>" +

            "Erro ao carregar produtos" +

            "</option>";

    }

}


/* =====================================================
   OBTER PRODUTO
===================================================== */

function obterProdutoPorId(
    id
) {

    for (
        var i = 0;
        i < produtosDisponiveis.length;
        i++
    ) {

        if (
            String(
                produtosDisponiveis[i].id
            )
            ===
            String(id)
        ) {

            return produtosDisponiveis[i];

        }

    }


    return null;

}


/* =====================================================
   ADICIONAR ITEM
===================================================== */

function adicionarItem() {

    var mesa =
        document.getElementById(
            "mesa"
        ).value;


    var produtoId =
        document.getElementById(
            "produto"
        ).value;


    var quantidade =
        Number(
            document.getElementById(
                "quantidade"
            ).value
        );


    if (mesa === "") {

        alert(
            "Escolha uma mesa."
        );

        return;

    }


    if (produtoId === "") {

        alert(
            "Escolha um produto."
        );

        return;

    }


    if (
        !Number.isFinite(
            quantidade
        )
        ||
        quantidade <= 0
    ) {

        alert(
            "Digite uma quantidade válida."
        );

        return;

    }


    var produto =
        obterProdutoPorId(
            produtoId
        );


    if (!produto) {

        alert(
            "Produto não encontrado."
        );

        return;

    }


    var quantidadeJaAdicionada =
        0;


    for (
        var i = 0;
        i < pedido.length;
        i++
    ) {

        if (
            String(
                pedido[i].produtoId
            )
            ===
            String(
                produto.id
            )
        ) {

            quantidadeJaAdicionada +=

                Number(
                    pedido[i].quantidade
                );

        }

    }


    var quantidadeTotal =

        quantidadeJaAdicionada +

        quantidade;


    if (
        quantidadeTotal >
        Number(
            produto.quantidade
        )
    ) {

        alert(

            "Estoque insuficiente para: " +

            produto.nome +

            "\n\nDisponível: " +

            produto.quantidade

        );

        return;

    }


    pedido.push({

        mesa:
            mesa,

        produtoId:
            produto.id,

        nome:
            produto.nome,

        quantidade:
            quantidade,

        custo:
            Number(
                produto.custo || 0
            ),

        venda:
            Number(
                produto.venda || 0
            )

    });


    mostrarPedido();


    document.getElementById(
        "quantidade"
    ).value = "";

}


/* =====================================================
   MOSTRAR PEDIDO
===================================================== */

function mostrarPedido() {

    var lista =
        document.getElementById(
            "listaPedido"
        );


    lista.innerHTML =
        "";


    var total =
        0;


    if (
        pedido.length === 0
    ) {

        lista.innerHTML =
            "<p>Nenhum item adicionado.</p>";


        document.getElementById(
            "totalPedido"
        ).style.display =
            "none";


        document.getElementById(
            "botaoEnviar"
        ).style.display =
            "none";


        mostrarMesasAbertas();

        return;

    }


    for (
        var i = 0;
        i < pedido.length;
        i++
    ) {

        var item =
            pedido[i];


        var subtotal =

            Number(
                item.quantidade
            )

            *

            Number(
                item.venda || 0
            );


        total +=
            subtotal;


        lista.innerHTML +=

            "<div class='item'>" +

            "<h3>🍽️ Mesa " +
            item.mesa +
            "</h3>" +

            "<p>" +
            item.nome +
            " × " +
            item.quantidade +
            "</p>" +

            "<p>R$ " +
            subtotal.toFixed(2) +
            "</p>" +

            "</div>";

    }


    document.getElementById(
        "totalPedido"
    ).innerText =

        "Total: R$ " +

        total.toFixed(2);


    document.getElementById(
        "totalPedido"
    ).style.display =
        "block";


    document.getElementById(
        "botaoEnviar"
    ).style.display =
        "inline-block";


    mostrarMesasAbertas();

}


/* =====================================================
   ENVIAR PEDIDO
===================================================== */

async function enviarPedido() {

    if (
        pedido.length === 0
    ) {

        alert(
            "Nenhum item no pedido."
        );

        return;

    }


    try {


        /* VALIDAR ESTOQUE */

        for (
            var i = 0;
            i < pedido.length;
            i++
        ) {

            var item =
                pedido[i];


            var consulta =
                await window.supabaseClient
                    .from("produtos")
                    .select("*")
                    .eq(
                        "id",
                        item.produtoId
                    )
                    .single();


            if (consulta.error) {

                throw consulta.error;

            }


            if (
                Number(
                    item.quantidade
                )
                >
                Number(
                    consulta.data.quantidade
                )
            ) {

                alert(

                    "Estoque insuficiente para: " +

                    consulta.data.nome

                );


                await carregarProdutos();

                return;

            }

        }


        /* BAIXAR ESTOQUE */

        for (
            var i = 0;
            i < pedido.length;
            i++
        ) {

            var item =
                pedido[i];


            var consulta =
                await window.supabaseClient
                    .from("produtos")
                    .select("quantidade")
                    .eq(
                        "id",
                        item.produtoId
                    )
                    .single();


            if (consulta.error) {

                throw consulta.error;

            }


            var novoEstoque =

                Number(
                    consulta.data.quantidade
                )

                -

                Number(
                    item.quantidade
                );


            var atualizacao =
                await window.supabaseClient
                    .from("produtos")
                    .update({

                        quantidade:
                            novoEstoque

                    })
                    .eq(
                        "id",
                        item.produtoId
                    );


            if (atualizacao.error) {

                throw atualizacao.error;

            }

        }


        /* COLOCAR NA MESA */

        for (
            var i = 0;
            i < pedido.length;
            i++
        ) {

            mesasAbertas.push({

                mesa:
                    pedido[i].mesa,

                produtoId:
                    pedido[i].produtoId,

                nome:
                    pedido[i].nome,

                quantidade:
                    pedido[i].quantidade,

                custo:
                    pedido[i].custo,

                venda:
                    pedido[i].venda

            });

        }


        salvarMesasAbertas();


        pedido =
            [];


        mostrarPedido();

        mostrarMesasAbertas();


        document.getElementById(
            "mesa"
        ).value = "";


        document.getElementById(
            "produto"
        ).value = "";


        document.getElementById(
            "quantidade"
        ).value = "";


        await carregarProdutos();


        alert(
            "Pedido enviado com sucesso!"
        );

    }

    catch (erro) {

        console.error(
            erro
        );


        alert(

            "Não foi possível enviar o pedido.\n\n" +

            (
                erro.message ||
                "Erro desconhecido."
            )

        );

    }

}


/* =====================================================
   MOSTRAR MESAS
===================================================== */

function mostrarMesasAbertas() {

    var area =
        document.getElementById(
            "mesasAbertas"
        );


    area.innerHTML =
        "";


    if (
        mesasAbertas.length === 0
    ) {

        area.innerHTML =
            "<p>Nenhuma mesa aberta.</p>";

        return;

    }


    var mesas =
        [];


    for (
        var i = 0;
        i < mesasAbertas.length;
        i++
    ) {

        var mesa =
            mesasAbertas[i].mesa;


        if (
            mesas.indexOf(
                mesa
            ) === -1
        ) {

            mesas.push(
                mesa
            );

        }

    }


    mesas.sort(
        function(a, b) {

            return Number(a) - Number(b);

        }
    );


    for (
        var i = 0;
        i < mesas.length;
        i++
    ) {

        var mesaAtual =
            mesas[i];


        var total =
            0;


        var itensMesa =
            [];


        for (
            var j = 0;
            j < mesasAbertas.length;
            j++
        ) {

            if (
                mesasAbertas[j].mesa
                ===
                mesaAtual
            ) {

                itensMesa.push(
                    mesasAbertas[j]
                );


                total +=

                    Number(
                        mesasAbertas[j].quantidade
                    )

                    *

                    Number(
                        mesasAbertas[j].venda || 0
                    );

            }

        }


        area.innerHTML +=

            "<div class='item mesa-aberta'>" +

            "<h3>🍽️ Mesa " +
            mesaAtual +
            "</h3>";


        for (
            var k = 0;
            k < itensMesa.length;
            k++
        ) {

            area.innerHTML +=

                "<p>" +

                itensMesa[k].nome +

                " × " +

                itensMesa[k].quantidade +

                " — R$ " +

                (

                    Number(
                        itensMesa[k].quantidade
                    )

                    *

                    Number(
                        itensMesa[k].venda || 0
                    )

                ).toFixed(2) +

                "</p>";

        }


        area.innerHTML +=

            "<p><strong>Total: R$ " +

            total.toFixed(2) +

            "</strong></p>" +


            "<button " +

            "class='fechar' " +

            "onclick='fecharMesa(\"" +

            mesaAtual +

            "\")'>" +

            "💰 Fechar mesa" +

            "</button>" +


            "</div>";

    }

}


/* =====================================================
   FECHAR MESA
===================================================== */

function fecharMesa(
    mesa
) {

    var confirmar =
        confirm(

            "Deseja fechar a Mesa " +

            mesa +

            "?"

        );


    if (!confirmar) {

        return;

    }


    var totalMesa =
        calcularTotalMesa(
            mesa
        );


    mostrarPagamento(
        mesa,
        totalMesa
    );

}


/* =====================================================
   CALCULAR TOTAL
===================================================== */

function calcularTotalMesa(
    mesa
) {

    var total =
        0;


    for (
        var i = 0;
        i < mesasAbertas.length;
        i++
    ) {

        if (
            mesasAbertas[i].mesa
            ===
            mesa
        ) {

            total +=

                Number(
                    mesasAbertas[i].quantidade
                )

                *

                Number(
                    mesasAbertas[i].venda || 0
                );

        }

    }


    return total;

}


/* =====================================================
   PAGAMENTO
===================================================== */

function mostrarPagamento(
    mesa,
    totalMesa
) {

    mostrarMesasAbertas();


    var area =
        document.getElementById(
            "mesasAbertas"
        );


    area.innerHTML +=

        "<div class='pagamento'>" +

        "<h2>💰 Fechamento da Mesa " +
        mesa +
        "</h2>" +

        "<h3>Total: R$ " +
        totalMesa.toFixed(2) +
        "</h3>" +

        "<p><strong>Como deseja fechar?</strong></p>" +


        "<button class='dinheiro' " +

        "onclick='confirmarPagamento(\"" +

        mesa +

        "\", \"Dinheiro\")'>" +

        "💵 Dinheiro" +

        "</button>" +


        "<button class='cartao' " +

        "onclick='confirmarPagamento(\"" +

        mesa +

        "\", \"Cartão\")'>" +

        "💳 Cartão" +

        "</button>" +


        "<button class='pix' " +

        "onclick='confirmarPagamento(\"" +

        mesa +

        "\", \"PIX\")'>" +

        "📱 PIX" +

        "</button>" +


        "<button class='conta-cliente' " +

        "onclick='abrirSelecaoCliente(\"" +

        mesa +

        "\")'>" +

        "👤 Adicionar à conta do cliente" +

        "</button>" +


        "<button class='cancelar' " +

        "onclick='cancelarPagamento()'>" +

        "❌ Cancelar" +

        "</button>" +


        "<div " +

        "id='selecaoCliente_" +
        mesa +
        "'>" +

        "</div>" +


        "</div>";

}


/* =====================================================
   CLIENTES
===================================================== */

async function abrirSelecaoCliente(
    mesa
) {

    var area =
        document.getElementById(
            "selecaoCliente_" + mesa
        );


    area.innerHTML =

        "<div class='selecionar-cliente'>" +

        "⏳ Carregando clientes..." +

        "</div>";


    try {

        var resultado =
            await window.supabaseClient
                .from("clientes")
                .select("*")
                .order(
                    "nome",
                    {
                        ascending: true
                    }
                );


        if (resultado.error) {

            throw resultado.error;

        }


        var clientes =
            resultado.data || [];


        if (
            clientes.length === 0
        ) {

            area.innerHTML =

                "<div class='selecionar-cliente'>" +

                "<strong>Nenhum cliente cadastrado.</strong>" +

                "<br><br>" +

                "Cadastre primeiro na tela Clientes." +

                "</div>";

            return;

        }


        var html =

            "<div class='selecionar-cliente'>" +

            "<h3>👤 Escolha o cliente</h3>" +

            "<select id='clienteConta_" +
            mesa +
            "'>" +

            "<option value=''>" +

            "Selecione o cliente" +

            "</option>";


        for (
            var i = 0;
            i < clientes.length;
            i++
        ) {

            html +=

                "<option value='" +

                clientes[i].id +

                "'>" +

                escaparHTML(
                    clientes[i].nome
                ) +

                "</option>";

        }


        html +=

            "</select>" +

            "<button " +

            "class='confirmar-conta' " +

            "onclick='adicionarMesaContaCliente(\"" +

            mesa +

            "\")'>" +

            "✅ Confirmar e liberar mesa" +

            "</button>" +

            "</div>";


        area.innerHTML =
            html;

    }

    catch (erro) {

        console.error(
            erro
        );


        area.innerHTML =

            "<div class='selecionar-cliente'>" +

            "❌ Erro ao carregar clientes." +

            "</div>";

    }

}


/* =====================================================
   ADICIONAR MESA À CONTA
===================================================== */

async function adicionarMesaContaCliente(
    mesa
) {

    if (
        pagamentoEmAndamento
    ) {

        return;

    }


    var select =
        document.getElementById(
            "clienteConta_" + mesa
        );


    var clienteId =
        select.value;


    if (
        clienteId === ""
    ) {

        alert(
            "Escolha o cliente."
        );

        return;

    }


    pagamentoEmAndamento =
        true;


    var contaCriadaId =
        null;


    try {


        var itens =
            [];


        var total =
            0;


        var custo =
            0;


        for (
            var i = 0;
            i < mesasAbertas.length;
            i++
        ) {

            if (
                mesasAbertas[i].mesa
                ===
                mesa
            ) {

                var item =
                    mesasAbertas[i];


                total +=

                    Number(
                        item.quantidade
                    )

                    *

                    Number(
                        item.venda || 0
                    );


                custo +=

                    Number(
                        item.quantidade
                    )

                    *

                    Number(
                        item.custo || 0
                    );


                itens.push(
                    item
                );

            }

        }


        if (
            itens.length === 0
        ) {

            throw new Error(
                "Nenhum item encontrado na mesa."
            );

        }


        var agora =
            new Date();


        var dataConsumo =

            String(
                agora.getDate()
            ).padStart(
                2,
                "0"
            )

            +

            "/"

            +

            String(
                agora.getMonth() + 1
            ).padStart(
                2,
                "0"
            )

            +

            "/"

            +

            agora.getFullYear();


        /* CRIAR CONTA */

        var resultadoConta =
            await window.supabaseClient
                .from("contas_clientes")
                .insert({

                    cliente_id:
                        Number(
                            clienteId
                        ),

                    data_consumo:
                        dataConsumo,

                    mesa:
                        String(
                            mesa
                        ),

                    total:
                        total,

                    custo:
                        custo,

                    status:
                        "Pendente",

                    forma_pagamento:
                        null,

                    data_pagamento:
                        null

                })
                .select("id")
                .single();


        if (
            resultadoConta.error
        ) {

            throw resultadoConta.error;

        }


        contaCriadaId =
            resultadoConta.data.id;


        /* PREPARAR ITENS */

        var itensBanco =
            [];


        for (
            var i = 0;
            i < itens.length;
            i++
        ) {

            itensBanco.push({

                conta_id:
                    contaCriadaId,

                produto_id:
                    itens[i].produtoId,

                nome_produto:
                    itens[i].nome,

                quantidade:
                    Number(
                        itens[i].quantidade
                    ),

                custo_unitario:
                    Number(
                        itens[i].custo || 0
                    ),

                venda_unitaria:
                    Number(
                        itens[i].venda || 0
                    )

            });

        }


        var resultadoItens =
            await window.supabaseClient
                .from("itens_conta_cliente")
                .insert(
                    itensBanco
                );


        if (
            resultadoItens.error
        ) {

            /*
               Se falhar ao gravar os itens,
               remove a conta incompleta.
            */

            await window.supabaseClient
                .from("contas_clientes")
                .delete()
                .eq(
                    "id",
                    contaCriadaId
                );


            throw resultadoItens.error;

        }


        /* LIBERAR MESA */

        removerMesaAberta(
            mesa
        );


        alert(

            "✅ Consumo adicionado à conta do cliente!\n\n" +

            "Mesa " +
            mesa +
            " liberada.\n" +

            "Total pendente adicionado: R$ " +

            total.toFixed(2)

        );

    }

    catch (erro) {

        console.error(
            "Erro ao adicionar à conta:",
            erro
        );


        alert(

            "❌ Não foi possível adicionar à conta.\n\n" +

            (
                erro.message ||
                "Erro desconhecido."
            )

        );

    }

    finally {

        pagamentoEmAndamento =
            false;

    }

}


/* =====================================================
   PAGAMENTO NORMAL
===================================================== */

async function confirmarPagamento(
    mesa,
    formaPagamento
) {

    if (
        pagamentoEmAndamento
    ) {

        return;

    }


    pagamentoEmAndamento =
        true;


    try {

        var itensFechados =
            [];


        var totalMesa =
            0;


        var custoMesa =
            0;


        for (
            var i = 0;
            i < mesasAbertas.length;
            i++
        ) {

            if (
                mesasAbertas[i].mesa
                ===
                mesa
            ) {

                var item =
                    mesasAbertas[i];


                var quantidade =
                    Number(
                        item.quantidade
                    );


                var venda =
                    Number(
                        item.venda || 0
                    );


                var custo =
                    Number(
                        item.custo || 0
                    );


                totalMesa +=
                    quantidade *
                    venda;


                custoMesa +=
                    quantidade *
                    custo;


                itensFechados.push({

                    produtoId:
                        item.produtoId,

                    nome:
                        item.nome,

                    quantidade:
                        quantidade,

                    custo:
                        custo,

                    venda:
                        venda

                });

            }

        }


        var agora =
            new Date();


        var horario =
            agora.toLocaleTimeString(
                "pt-BR"
            );


        /* VENDA */

        var resultadoVenda =
            await window.supabaseClient
                .from("vendas")
                .insert({

                    mesa:
                        String(
                            mesa
                        ),

                    horario:
                        horario,

                    total:
                        totalMesa,

                    custo:
                        custoMesa,

                    forma_pagamento:
                        formaPagamento

                })
                .select("id")
                .single();


        if (
            resultadoVenda.error
        ) {

            throw resultadoVenda.error;

        }


        var vendaId =
            resultadoVenda.data.id;


        /* ITENS */

        var itensBanco =
            [];


        for (
            var i = 0;
            i < itensFechados.length;
            i++
        ) {

            itensBanco.push({

                venda_id:
                    vendaId,

                produto_id:
                    itensFechados[i].produtoId,

                nome_produto:
                    itensFechados[i].nome,

                quantidade:
                    itensFechados[i].quantidade,

                custo_unitario:
                    itensFechados[i].custo,

                venda_unitaria:
                    itensFechados[i].venda

            });

        }


        var resultadoItens =
            await window.supabaseClient
                .from("itens_venda")
                .insert(
                    itensBanco
                );


        if (
            resultadoItens.error
        ) {

            throw resultadoItens.error;

        }


        vendasDoDia.push({

            id:
                vendaId,

            mesa:
                mesa,

            horario:
                horario,

            total:
                totalMesa,

            custo:
                custoMesa,

            formaPagamento:
                formaPagamento,

            itens:
                itensFechados

        });


        salvarVendasDoDia();


        removerMesaAberta(
            mesa
        );


        alert(

            "Mesa " +
            mesa +
            " fechada com sucesso!\n\n" +

            "Pagamento: " +
            formaPagamento +
            "\n" +

            "Total: R$ " +
            totalMesa.toFixed(2)

        );

    }

    catch (erro) {

        console.error(
            erro
        );


        alert(

            "❌ Não foi possível fechar a mesa.\n\n" +

            (
                erro.message ||
                "Erro desconhecido."
            )

        );

    }

    finally {

        pagamentoEmAndamento =
            false;

    }

}


/* =====================================================
   REMOVER MESA
===================================================== */

function removerMesaAberta(
    mesa
) {

    var novasMesas =
        [];


    for (
        var i = 0;
        i < mesasAbertas.length;
        i++
    ) {

        if (
            mesasAbertas[i].mesa
            !==
            mesa
        ) {

            novasMesas.push(
                mesasAbertas[i]
            );

        }

    }


    mesasAbertas =
        novasMesas;


    salvarMesasAbertas();


    mostrarMesasAbertas();

}


/* =====================================================
   CANCELAR
===================================================== */

function cancelarPagamento() {

    mostrarMesasAbertas();

}


/* =====================================================
   VENDAS LOCAL
===================================================== */

function salvarVendasDoDia() {

    var data =
        obterDataAtual();


    localStorage.setItem(

        "vendas_" + data,

        JSON.stringify(
            vendasDoDia
        )

    );

}


function carregarVendasDoDia() {

    var data =
        obterDataAtual();


    var dados =
        localStorage.getItem(
            "vendas_" + data
        );


    if (!dados) {

        vendasDoDia =
            [];

        return;

    }


    try {

        vendasDoDia =
            JSON.parse(
                dados
            );


        if (
            !Array.isArray(
                vendasDoDia
            )
        ) {

            vendasDoDia =
                [];

        }

    }

    catch (erro) {

        vendasDoDia =
            [];

    }

}


/* =====================================================
   DATA
===================================================== */

function obterDataAtual() {

    var agora =
        new Date();


    var dia =
        String(
            agora.getDate()
        ).padStart(
            2,
            "0"
        );


    var mes =
        String(
            agora.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    var ano =
        agora.getFullYear();


    return (
        dia +
        "-" +
        mes +
        "-" +
        ano
    );

}


function formatarDataAtual() {

    var agora =
        new Date();


    var dia =
        String(
            agora.getDate()
        ).padStart(
            2,
            "0"
        );


    var mes =
        String(
            agora.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    var ano =
        agora.getFullYear();


    return (
        dia +
        "/" +
        mes +
        "/" +
        ano
    );

}


/* =====================================================
   FECHAMENTO DO DIA
===================================================== */

function fecharDia() {

    if (
        mesasAbertas.length > 0
    ) {

        alert(

            "Ainda existem mesas abertas.\n\n" +

            "Feche todas antes do fechamento diário."

        );

        return;

    }


    if (
        vendasDoDia.length === 0
    ) {

        alert(
            "Ainda não existem vendas pagas hoje."
        );

        return;

    }


    var totalVendas =
        0;


    var totalCusto =
        0;


    var pagamentos = {

        "Dinheiro": 0,

        "Cartão": 0,

        "PIX": 0

    };


    var produtosVendidos =
        {};


    for (
        var i = 0;
        i < vendasDoDia.length;
        i++
    ) {

        var venda =
            vendasDoDia[i];


        totalVendas +=

            Number(
                venda.total || 0
            );


        totalCusto +=

            Number(
                venda.custo || 0
            );


        if (
            pagamentos[
                venda.formaPagamento
            ] !== undefined
        ) {

            pagamentos[
                venda.formaPagamento
            ] +=

                Number(
                    venda.total || 0
                );

        }


        if (
            Array.isArray(
                venda.itens
            )
        ) {

            for (
                var j = 0;
                j < venda.itens.length;
                j++
            ) {

                var item =
                    venda.itens[j];


                if (
                    !produtosVendidos[
                        item.nome
                    ]
                ) {

                    produtosVendidos[
                        item.nome
                    ] = 0;

                }


                produtosVendidos[
                    item.nome
                ] +=

                    Number(
                        item.quantidade || 0
                    );

            }

        }

    }


    var lucro =

        totalVendas -

        totalCusto;


    var html =
        "";


    html +=

        "<h2>📊 Fechamento do dia</h2>" +

        "<p><strong>Data:</strong> " +

        formatarDataAtual() +

        "</p>" +

        "<p><strong>Vendas pagas:</strong> " +

        vendasDoDia.length +

        "</p>" +

        "<hr>" +

        "<h3>💰 Total recebido</h3>" +

        "<p>R$ " +

        totalVendas.toFixed(2) +

        "</p>" +

        "<h3>💵 Total de custo</h3>" +

        "<p>R$ " +

        totalCusto.toFixed(2) +

        "</p>" +

        "<h3>🟢 Lucro</h3>" +

        "<p class='lucro'>R$ " +

        lucro.toFixed(2) +

        "</p>" +

        "<hr>" +

        "<h3>💳 Formas de pagamento</h3>" +

        "<p>💵 Dinheiro: R$ " +

        pagamentos["Dinheiro"].toFixed(2) +

        "</p>" +

        "<p>💳 Cartão: R$ " +

        pagamentos["Cartão"].toFixed(2) +

        "</p>" +

        "<p>📱 PIX: R$ " +

        pagamentos["PIX"].toFixed(2) +

        "</p>" +

        "<hr>" +

        "<h3>🥩 Produtos vendidos</h3>";


    var nomes =
        Object.keys(
            produtosVendidos
        );


    for (
        var i = 0;
        i < nomes.length;
        i++
    ) {

        html +=

            "<div class='produto-vendido'>" +

            nomes[i] +

            " × " +

            produtosVendidos[
                nomes[i]
            ] +

            "</div>";

    }


    document.getElementById(
        "resultadoFechamento"
    ).innerHTML =
        html;


    document.getElementById(
        "resultadoFechamento"
    ).style.display =
        "block";

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(
    texto
) {

    return String(
        texto || ""
    )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   INICIAR
===================================================== */

window.onload =
    async function() {

        await carregarProdutos();

        carregarVendasDoDia();

        carregarMesasAbertas();

        mostrarMesasAbertas();

    };


</script>
