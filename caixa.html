<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Caixa - Espetinho do Will</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        header p {
            margin-bottom: 0;
            color: #ddd;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 25px;
        }

        .caixa {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .resumo {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin-top: 0;
            color: #555;
        }

        .valor {
            font-size: 25px;
            font-weight: bold;
            margin-top: 10px;
        }

        .dinheiro {
            border-top: 5px solid #198754;
        }

        .cartao {
            border-top: 5px solid #0d6efd;
        }

        .pix {
            border-top: 5px solid #6f42c1;
        }

        .vendas {
            border-top: 5px solid #ffc107;
        }

        .custo {
            border-top: 5px solid #dc3545;
        }

        .lucro {
            border-top: 5px solid #20c997;
        }

        .total {
            background: #198754;
            color: white;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
        }

        .total h2 {
            margin: 0;
        }

        .total .valor {
            font-size: 32px;
        }

        .venda-item {
            background: #f8f8f8;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            border-left: 5px solid #198754;
        }

        .venda-item strong {
            font-size: 18px;
        }

        .botao {
            display: inline-block;
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            margin-right: 5px;
        }

        .atualizar {
            background: #0d6efd;
            color: white;
        }

        .voltar {
            background: #6c757d;
            color: white;
        }

        .mensagem {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        .erro {
            background: #f8d7da;
            color: #842029;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .carregando {
            text-align: center;
            padding: 20px;
            color: #555;
        }

        @media (max-width: 700px) {

            .resumo {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 15px;
            }

            .botao {
                width: 100%;
                margin-right: 0;
            }

        }

    </style>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


</head>


<body>


<header>

    <h1>🥩 Espetinho do Will</h1>

    <p>💰 Caixa</p>

</header>


<div class="container">


    <!-- CABEÇALHO -->

    <div class="caixa">

        <h2>💰 Caixa</h2>

        <p>
            Dados carregados diretamente do banco online.
        </p>


        <button
            class="botao atualizar"
            onclick="carregarCaixa()"
        >
            🔄 Atualizar caixa
        </button>


        <button
            class="botao voltar"
            onclick="voltarMenu()"
        >
            🏠 Menu Principal
        </button>

    </div>



    <!-- ERRO -->

    <div
        id="areaErro"
        style="display:none;"
    >
    </div>



    <!-- RESUMO -->

    <div class="resumo">


        <div class="card dinheiro">

            <h3>💵 Dinheiro</h3>

            <div
                id="totalDinheiro"
                class="valor"
            >
                R$ 0,00
            </div>

        </div>



        <div class="card cartao">

            <h3>💳 Cartão</h3>

            <div
                id="totalCartao"
                class="valor"
            >
                R$ 0,00
            </div>

        </div>



        <div class="card pix">

            <h3>📱 PIX</h3>

            <div
                id="totalPix"
                class="valor"
            >
                R$ 0,00
            </div>

        </div>



        <div class="card vendas">

            <h3>🍽️ Mesas fechadas</h3>

            <div
                id="quantidadeMesas"
                class="valor"
            >
                0
            </div>

        </div>



        <div class="card custo">

            <h3>📦 Custo das vendas</h3>

            <div
                id="totalCustos"
                class="valor"
            >
                R$ 0,00
            </div>

        </div>



        <div class="card lucro">

            <h3>📈 Lucro</h3>

            <div
                id="totalLucro"
                class="valor"
            >
                R$ 0,00
            </div>

        </div>


    </div>



    <!-- TOTAL -->

    <div class="total">

        <h2>💰 Total vendido</h2>

        <div
            id="totalVendas"
            class="valor"
        >
            R$ 0,00
        </div>

    </div>



    <!-- VENDAS -->

    <div class="caixa">

        <h2>📋 Vendas realizadas</h2>


        <div id="listaVendas">

            <div class="carregando">
                ⏳ Carregando vendas...
            </div>

        </div>

    </div>


</div>



<script>


/* =====================================================
   PROTEÇÃO DE LOGIN
===================================================== */

var usuarioLogado =
    localStorage.getItem(
        "usuarioLogado"
    );


if (!usuarioLogado) {

    window.location.href =
        "login.html";

}



/* =====================================================
   FORMATAR DINHEIRO
===================================================== */

function formatarMoeda(
    valor
) {

    return Number(
        valor || 0
    ).toLocaleString(

        "pt-BR",

        {
            style: "currency",
            currency: "BRL"
        }

    );

}



/* =====================================================
   CARREGAR VENDAS DO SUPABASE
===================================================== */

async function carregarVendas() {

    if (
        !window.supabaseClient
    ) {

        throw new Error(
            "Conexão com Supabase não encontrada."
        );

    }


    var resultado =
        await window.supabaseClient
            .from("vendas")
            .select("*")
            .order(
                "id",
                {
                    ascending: false
                }
            );


    if (
        resultado.error
    ) {

        throw resultado.error;

    }


    return resultado.data || [];

}



/* =====================================================
   CARREGAR CAIXA
===================================================== */

async function carregarCaixa() {


    var lista =
        document.getElementById(
            "listaVendas"
        );


    var areaErro =
        document.getElementById(
            "areaErro"
        );


    areaErro.style.display =
        "none";


    lista.innerHTML =

        "<div class='carregando'>" +

        "⏳ Carregando vendas..." +

        "</div>";


    try {


        var vendas =
            await carregarVendas();


        var totalVendas =
            0;


        var totalCustos =
            0;


        var totalDinheiro =
            0;


        var totalCartao =
            0;


        var totalPix =
            0;



        /*
           SOMAR VENDAS
        */

        for (
            var i = 0;
            i < vendas.length;
            i++
        ) {


            var venda =
                vendas[i];


            var valor =
                Number(
                    venda.total || 0
                );


            var custo =
                Number(
                    venda.custo || 0
                );


            totalVendas +=
                valor;


            totalCustos +=
                custo;



            /*
               FORMAS DE PAGAMENTO
            */

            var forma =
                venda.forma_pagamento;


            if (
                forma === "Dinheiro"
            ) {

                totalDinheiro +=
                    valor;

            }


            else if (
                forma === "Cartão"
            ) {

                totalCartao +=
                    valor;

            }


            else if (
                forma === "PIX"
            ) {

                totalPix +=
                    valor;

            }

        }



        /*
           LUCRO
        */

        var totalLucro =

            totalVendas -

            totalCustos;



        /*
           MOSTRAR RESUMO
        */

        document.getElementById(
            "totalVendas"
        ).innerText =
            formatarMoeda(
                totalVendas
            );


        document.getElementById(
            "totalCustos"
        ).innerText =
            formatarMoeda(
                totalCustos
            );


        document.getElementById(
            "totalLucro"
        ).innerText =
            formatarMoeda(
                totalLucro
            );


        document.getElementById(
            "totalDinheiro"
        ).innerText =
            formatarMoeda(
                totalDinheiro
            );


        document.getElementById(
            "totalCartao"
        ).innerText =
            formatarMoeda(
                totalCartao
            );


        document.getElementById(
            "totalPix"
        ).innerText =
            formatarMoeda(
                totalPix
            );


        document.getElementById(
            "quantidadeMesas"
        ).innerText =
            vendas.length;



        /*
           MOSTRAR LISTA
        */

        mostrarVendas(
            vendas
        );

    }


    catch (erro) {


        console.error(
            "Erro ao carregar caixa:",
            erro
        );


        lista.innerHTML =
            "";


        areaErro.innerHTML =

            "<div class='erro'>" +

            "❌ Não foi possível carregar o caixa." +

            "<br><br>" +

            "Erro: " +

            (
                erro.message ||
                "Erro desconhecido."
            ) +

            "</div>";


        areaErro.style.display =
            "block";

    }

}



/* =====================================================
   MOSTRAR VENDAS
===================================================== */

function mostrarVendas(
    vendas
) {


    var area =
        document.getElementById(
            "listaVendas"
        );


    area.innerHTML =
        "";



    if (
        vendas.length === 0
    ) {

        area.innerHTML =

            "<div class='mensagem'>" +

            "Nenhuma venda registrada." +

            "</div>";

        return;

    }



    for (
        var i = 0;
        i < vendas.length;
        i++
    ) {


        var venda =
            vendas[i];


        var forma =
            venda.forma_pagamento ||
            "Não informado";


        var html =
            "";


        html +=
            "<div class='venda-item'>";


        html +=

            "<strong>" +

            "🍽️ Mesa " +

            venda.mesa +

            "</strong>";


        html +=

            "<p>" +

            "🧾 Venda ID: " +

            venda.id +

            "</p>";


        html +=

            "<p>" +

            "🕐 Horário: " +

            (
                venda.horario ||
                "-"
            ) +

            "</p>";


        html +=

            "<p>" +

            "💳 Pagamento: " +

            forma +

            "</p>";


        html +=

            "<p>" +

            "📦 Custo: " +

            formatarMoeda(
                venda.custo
            ) +

            "</p>";


        html +=

            "<p>" +

            "💰 Total: <strong>" +

            formatarMoeda(
                venda.total
            ) +

            "</strong></p>";


        var lucroVenda =

            Number(
                venda.total || 0
            )

            -

            Number(
                venda.custo || 0
            );


        html +=

            "<p>" +

            "📈 Lucro: <strong>" +

            formatarMoeda(
                lucroVenda
            ) +

            "</strong></p>";


        html +=
            "</div>";


        area.innerHTML +=
            html;

    }

}



/* =====================================================
   VOLTAR
===================================================== */

function voltarMenu() {

    window.location.href =
        "index.html";

}



/* =====================================================
   INICIAR
===================================================== */

window.onload =
    async function() {

        await carregarCaixa();

    };


</script>


</body>

</html>
