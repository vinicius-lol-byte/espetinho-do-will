```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Espetinho do Will</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:

                linear-gradient(
                    rgba(0,0,0,0.70),
                    rgba(0,0,0,0.70)
                ),

                url("tema-espetinho.jpg");

            background-size: cover;

            background-position: center;

        }


        .login-container {

            width: 100%;

            max-width: 420px;

            padding: 20px;

        }


        .login-box {

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.35);

            text-align: center;

        }


        .logo {

            font-size: 65px;

            margin-bottom: 5px;

        }


        h1 {

            margin: 0;

            font-size: 30px;

            color: #222;

        }


        .subtitulo {

            color: #777;

            margin-top: 8px;

            margin-bottom: 30px;

        }


        .campo {

            text-align: left;

            margin-bottom: 18px;

        }


        .campo label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;

        }


        .campo input {

            width: 100%;

            padding: 14px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            outline: none;

        }


        .campo input:focus {

            border-color: #198754;

        }


        .botao-login {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 8px;

            background: #198754;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;

        }


        .botao-login:hover {

            background: #157347;

        }


        .erro {

            display: none;

            background: #f8d7da;

            color: #842029;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;

        }


        .rodape {

            margin-top: 25px;

            color: #777;

            font-size: 13px;

        }


        @media (max-width: 500px) {

            .login-container {

                padding: 15px;

            }


            .login-box {

                padding: 28px 22px;

            }


            h1 {

                font-size: 26px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-box">


        <div class="logo">
            🥩🔥
        </div>


        <h1>
            Espetinho do Will
        </h1>


        <p class="subtitulo">
            Acesse o sistema
        </p>



        <!-- MENSAGEM DE ERRO -->

        <div
            id="mensagemErro"
            class="erro"
        >

            Usuário ou senha incorretos.

        </div>



        <!-- USUÁRIO -->

        <div class="campo">

            <label for="usuario">
                Usuário
            </label>

            <input
                type="text"
                id="usuario"
                placeholder="Digite seu usuário"
                autocomplete="username"
            >

        </div>



        <!-- SENHA -->

        <div class="campo">

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
            >

        </div>



        <!-- BOTÃO -->

        <button
            class="botao-login"
            onclick="entrar()"
        >

            🔐 Entrar

        </button>



        <div class="rodape">

            Espetinho do Will
            <br>
            Sistema de controle

        </div>


    </div>

</div>



<script>


/* =====================================
   LOGIN TEMPORÁRIO
===================================== */

function entrar() {


    var usuario =
        document.getElementById(
            "usuario"
        ).value.trim();


    var senha =
        document.getElementById(
            "senha"
        ).value;


    var mensagem =
        document.getElementById(
            "mensagemErro"
        );


    /*
       POR ENQUANTO ESTAMOS USANDO
       UM USUÁRIO TEMPORÁRIO.

       DEPOIS VAMOS SUBSTITUIR ISSO
       PELO SISTEMA DE USUÁRIOS.
    */


    if (
        usuario === "admin" &&
        senha === "1234"
    ) {


        /*
           SALVAR LOGIN
        */

        localStorage.setItem(
            "usuarioLogado",
            "admin"
        );


        /*
           IR PARA O MENU PRINCIPAL
        */

        window.location.href =
            "index.html";


    }

    else {


        mensagem.style.display =
            "block";


        document.getElementById(
            "senha"
        ).value = "";


        document.getElementById(
            "senha"
        ).focus();

    }

}



/* =====================================
   ENTER PARA ENTRAR
===================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            entrar();

        }

    }
);


</script>


</body>

</html>
