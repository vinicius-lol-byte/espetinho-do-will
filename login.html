<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Espetinho do Will</title>

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --preto: #070707;
            --preto-2: #111111;
            --preto-3: #1b1b1b;

            --dourado: #d4af37;
            --dourado-claro: #f0d77a;
            --dourado-escuro: #8f701d;

            --prata: #d7d7d7;
            --prata-2: #8f8f8f;

            --bordo: #7d1e24;
            --bordo-claro: #a62a32;

            --texto: #f4f4f4;
            --texto-2: #b7b7b7;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            color: var(--texto);

            background:
                linear-gradient(
                    rgba(0,0,0,0.84),
                    rgba(0,0,0,0.92)
                ),
                url("tema-espetinho.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .login-box {
            position: relative;
            overflow: hidden;

            padding: 38px;

            background:
                linear-gradient(
                    145deg,
                    rgba(31,31,31,0.97),
                    rgba(12,12,12,0.98) 60%,
                    rgba(22,22,22,0.98)
                );

            border-radius: 18px;

            border:
                1px solid
                rgba(212,175,55,0.75);

            box-shadow:
                0 16px 50px rgba(0,0,0,0.72),
                0 0 28px rgba(212,175,55,0.08),
                inset 0 1px 0 rgba(255,255,255,0.05);

            text-align: center;
        }

        .login-box::before {
            content: "";
            position: absolute;

            left: 0;
            right: 0;
            top: 0;

            height: 4px;

            background:
                linear-gradient(
                    90deg,
                    var(--dourado-escuro),
                    var(--dourado-claro),
                    var(--prata),
                    var(--dourado)
                );
        }

        .logo {
            font-size: 64px;
            margin-bottom: 8px;

            filter:
                drop-shadow(
                    0 3px 7px
                    rgba(0,0,0,0.7)
                );
        }

        h1 {
            margin: 0;
            font-size: 30px;

            background:
                linear-gradient(
                    90deg,
                    var(--dourado-escuro),
                    var(--dourado-claro),
                    #fff2ae,
                    var(--dourado)
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitulo {
            color: #bcbcbc;
            margin-top: 8px;
            margin-bottom: 30px;
        }

        .campo {
            text-align: left;
            margin-bottom: 18px;
        }

        .campo label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
            color: var(--dourado-claro);
        }

        .campo input {
            width: 100%;

            padding: 14px;

            border:
                1px solid #464646;

            border-radius: 8px;

            font-size: 16px;
            outline: none;

            background:
                linear-gradient(
                    180deg,
                    #1b1b1b,
                    #101010
                );

            color: white;

            transition: 0.2s;
        }

        .campo input::placeholder {
            color: #777;
        }

        .campo input:focus {
            border-color: var(--dourado);

            box-shadow:
                0 0 0 3px
                rgba(212,175,55,0.10);
        }

        .botao-login {
            width: 100%;

            padding: 15px;

            border-radius: 8px;

            border:
                1px solid
                rgba(240,215,122,0.55);

            background:
                linear-gradient(
                    180deg,
                    #d5b23c,
                    #8b6a19
                );

            color: #111;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            margin-top: 8px;

            box-shadow:
                0 6px 18px
                rgba(0,0,0,0.35);

            transition:
                0.2s;
        }

        .botao-login:hover {
            filter: brightness(1.12);
            transform: translateY(-2px);
        }

        .botao-login:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .erro {
            display: none;

            background:
                linear-gradient(
                    180deg,
                    #471418,
                    #280b0d
                );

            border:
                1px solid #79272d;

            color: #ffd2d5;

            padding: 13px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;
        }

        .carregando {
            display: none;

            color: var(--dourado-claro);

            margin-top: 18px;

            font-size: 14px;
        }

        .rodape {
            margin-top: 28px;

            color: #747474;

            font-size: 13px;
            line-height: 1.5;
        }

        @media (max-width: 500px) {

            .login-container {
                padding: 15px;
            }

            .login-box {
                padding: 30px 22px;
            }

            h1 {
                font-size: 26px;
            }

        }

    </style>

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script src="supabase.js"></script>

</head>


<body>


<div class="login-container">

    <div class="login-box">

        <div class="logo">
            🥩🔥
        </div>

        <h1>
            Espetinho do Will
        </h1>

        <p class="subtitulo">
            Sistema de gerenciamento
        </p>

        <div
            id="mensagemErro"
            class="erro"
        >
        </div>

        <div class="campo">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                autocomplete="email"
            >

        </div>

        <div class="campo">

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
            >

        </div>

        <button
            id="botaoEntrar"
            class="botao-login"
            onclick="entrar()"
        >
            🔐 Entrar
        </button>

        <div
            id="carregando"
            class="carregando"
        >
            ⏳ Verificando acesso...
        </div>

        <div class="rodape">

            Espetinho do Will

            <br>

            Sistema de controle

        </div>

    </div>

</div>


<script>


var loginEmAndamento =
    false;


/* =====================================================
   VERIFICAR SE JÁ ESTÁ LOGADO
===================================================== */

async function verificarSessao() {

    try {

        if (!window.supabaseClient) {

            mostrarErro(
                "Não foi possível conectar ao sistema."
            );

            return;

        }

        var resultado =
            await window.supabaseClient
                .auth
                .getSession();

        if (resultado.error) {

            console.error(
                resultado.error
            );

            return;

        }

        if (resultado.data.session) {

            window.location.replace(
                "index.html"
            );

        }

    }

    catch (erro) {

        console.error(
            "Erro ao verificar sessão:",
            erro
        );

    }

}


/* =====================================================
   LOGIN
===================================================== */

async function entrar() {

    if (loginEmAndamento) {

        return;

    }

    var email =
        document.getElementById(
            "email"
        ).value.trim();

    var senha =
        document.getElementById(
            "senha"
        ).value;

    var botao =
        document.getElementById(
            "botaoEntrar"
        );

    var carregando =
        document.getElementById(
            "carregando"
        );

    esconderErro();

    if (email === "") {

        mostrarErro(
            "Digite seu e-mail."
        );

        document.getElementById(
            "email"
        ).focus();

        return;

    }

    if (senha === "") {

        mostrarErro(
            "Digite sua senha."
        );

        document.getElementById(
            "senha"
        ).focus();

        return;

    }

    if (!window.supabaseClient) {

        mostrarErro(
            "Não foi possível conectar ao sistema."
        );

        return;

    }

    try {

        loginEmAndamento =
            true;

        botao.disabled =
            true;

        botao.innerText =
            "Entrando...";

        carregando.style.display =
            "block";

        var resultado =
            await window.supabaseClient
                .auth
                .signInWithPassword({

                    email:
                        email,

                    password:
                        senha

                });

        if (resultado.error) {

            throw resultado.error;

        }

        if (resultado.data.session) {

            window.location.replace(
                "index.html"
            );

            return;

        }

        throw new Error(
            "Não foi possível iniciar a sessão."
        );

    }

    catch (erro) {

        console.error(
            "Erro no login:",
            erro
        );

        mostrarErro(
            "E-mail ou senha incorretos."
        );

        document.getElementById(
            "senha"
        ).value =
            "";

        document.getElementById(
            "senha"
        ).focus();

    }

    finally {

        loginEmAndamento =
            false;

        botao.disabled =
            false;

        botao.innerText =
            "🔐 Entrar";

        carregando.style.display =
            "none";

    }

}


/* =====================================================
   MOSTRAR ERRO
===================================================== */

function mostrarErro(
    texto
) {

    var mensagem =
        document.getElementById(
            "mensagemErro"
        );

    mensagem.innerText =
        texto;

    mensagem.style.display =
        "block";

}


/* =====================================================
   ESCONDER ERRO
===================================================== */

function esconderErro() {

    document.getElementById(
        "mensagemErro"
    ).style.display =
        "none";

}


/* =====================================================
   ENTER PARA ENTRAR
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !loginEmAndamento
        ) {

            entrar();

        }

    }
);


/* =====================================================
   INICIAR
===================================================== */

verificarSessao();


</script>


</body>

</html>
