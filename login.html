<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Espetinho do Will</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background:

                linear-gradient(
                    rgba(0,0,0,0.85),
                    rgba(0,0,0,0.90)
                ),

                url("tema-espetinho.jpg");

            background-size: cover;

            background-position: center;

            color: white;

        }


        .login-container {

            width: 100%;

            max-width: 430px;

            padding: 20px;

        }


        .login-box {

            background: #111111;

            padding: 38px;

            border-radius: 18px;

            border: 1px solid #d4af37;

            box-shadow:

                0 10px 40px rgba(0,0,0,0.65),

                0 0 25px rgba(212,175,55,0.08);

            text-align: center;

        }


        .logo {

            font-size: 65px;

            margin-bottom: 8px;

        }


        h1 {

            margin: 0;

            font-size: 30px;

            color: #d4af37;

        }


        .subtitulo {

            color: #bdbdbd;

            margin-top: 8px;

            margin-bottom: 30px;

        }


        .campo {

            text-align: left;

            margin-bottom: 18px;

        }


        .campo label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #d4af37;

        }


        .campo input {

            width: 100%;

            padding: 14px;

            border: 1px solid #444;

            border-radius: 8px;

            font-size: 16px;

            outline: none;

            background: #1c1c1c;

            color: white;

        }


        .campo input::placeholder {

            color: #777;

        }


        .campo input:focus {

            border-color: #d4af37;

            box-shadow:
                0 0 0 2px
                rgba(212,175,55,0.12);

        }


        .botao-login {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 8px;

            background: #d4af37;

            color: #111;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 8px;

            transition: 0.2s;

        }


        .botao-login:hover {

            background: #f0c94b;

            transform: translateY(-1px);

        }


        .botao-login:disabled {

            opacity: 0.6;

            cursor: not-allowed;

            transform: none;

        }


        .erro {

            display: none;

            background: #3a1111;

            border: 1px solid #8b2c2c;

            color: #ffb3b3;

            padding: 13px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;

        }


        .carregando {

            display: none;

            color: #d4af37;

            margin-top: 18px;

            font-size: 14px;

        }


        .rodape {

            margin-top: 28px;

            color: #777;

            font-size: 13px;

            line-height: 1.5;

        }


        @media (max-width: 500px) {

            .login-container {

                padding: 15px;

            }


            .login-box {

                padding: 30px 22px;

            }


            h1 {

                font-size: 26px;

            }

        }

    </style>


    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script src="supabase.js"></script>


</head>


<body>


<div class="login-container">


    <div class="login-box">


        <div class="logo">
            🥩🔥
        </div>


        <h1>
            Espetinho do Will
        </h1>


        <p class="subtitulo">
            Sistema de gerenciamento
        </p>



        <div
            id="mensagemErro"
            class="erro"
        >
        </div>



        <!-- EMAIL -->

        <div class="campo">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                autocomplete="email"
            >

        </div>



        <!-- SENHA -->

        <div class="campo">

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                autocomplete="current-password"
            >

        </div>



        <!-- BOTÃO -->

        <button
            id="botaoEntrar"
            class="botao-login"
            onclick="entrar()"
        >

            🔐 Entrar

        </button>



        <div
            id="carregando"
            class="carregando"
        >

            ⏳ Verificando acesso...

        </div>



        <div class="rodape">

            Espetinho do Will

            <br>

            Sistema de controle

        </div>


    </div>

</div>



<script>


/* =====================================================
   VERIFICAR SE JÁ ESTÁ LOGADO
===================================================== */

async function verificarSessao() {


    try {


        if (
            !window.supabaseClient
        ) {

            mostrarErro(
                "Não foi possível conectar ao sistema."
            );

            return;

        }


        const resultado =
            await window.supabaseClient.auth.getSession();


        if (
            resultado.error
        ) {

            console.error(
                resultado.error
            );

            return;

        }


        if (
            resultado.data.session
        ) {

            window.location.href =
                "index.html";

        }


    }

    catch (erro) {

        console.error(
            "Erro ao verificar sessão:",
            erro
        );

    }

}



/* =====================================================
   LOGIN
===================================================== */

async function entrar() {


    var email =
        document.getElementById(
            "email"
        ).value.trim();


    var senha =
        document.getElementById(
            "senha"
        ).value;


    var botao =
        document.getElementById(
            "botaoEntrar"
        );


    var carregando =
        document.getElementById(
            "carregando"
        );


    esconderErro();



    /* VALIDAR CAMPOS */

    if (
        email === ""
    ) {

        mostrarErro(
            "Digite seu e-mail."
        );

        document.getElementById(
            "email"
        ).focus();

        return;

    }


    if (
        senha === ""
    ) {

        mostrarErro(
            "Digite sua senha."
        );

        document.getElementById(
            "senha"
        ).focus();

        return;

    }



    try {


        botao.disabled =
            true;


        botao.innerText =
            "Entrando...";


        carregando.style.display =
            "block";



        const resultado =
            await window.supabaseClient
                .auth
                .signInWithPassword({

                    email: email,

                    password: senha

                });



        if (
            resultado.error
        ) {

            throw resultado.error;

        }



        if (
            resultado.data.session
        ) {

            window.location.href =
                "index.html";

            return;

        }



        throw new Error(
            "Não foi possível iniciar a sessão."
        );


    }

    catch (erro) {


        console.error(
            "Erro no login:",
            erro
        );


        mostrarErro(
            "E-mail ou senha incorretos."
        );


        document.getElementById(
            "senha"
        ).value =
            "";


        document.getElementById(
            "senha"
        ).focus();


    }

    finally {


        botao.disabled =
            false;


        botao.innerText =
            "🔐 Entrar";


        carregando.style.display =
            "none";

    }

}



/* =====================================================
   MOSTRAR ERRO
===================================================== */

function mostrarErro(
    texto
) {

    var mensagem =
        document.getElementById(
            "mensagemErro"
        );


    mensagem.innerText =
        texto;


    mensagem.style.display =
        "block";

}



/* =====================================================
   ESCONDER ERRO
===================================================== */

function esconderErro() {

    document.getElementById(
        "mensagemErro"
    ).style.display =
        "none";

}



/* =====================================================
   ENTER PARA ENTRAR
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            entrar();

        }

    }
);



/* =====================================================
   INICIAR
===================================================== */

verificarSessao();


</script>


</body>

</html>
