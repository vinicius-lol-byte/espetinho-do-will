<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Fechamento Diário - Espetinho do Will</title>

        <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --preto: #070707;
            --preto-2: #101010;
            --preto-3: #1a1a1a;

            --dourado: #d4af37;
            --dourado-claro: #f0d77a;
            --dourado-escuro: #8e6f1e;

            --prata: #d8d8d8;
            --prata-2: #909090;

            --bordo: #7d1e24;
            --bordo-claro: #a62a32;

            --verde: #71947e;
            --texto: #f4f4f4;
            --texto-2: #b8b8b8;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--texto);

            background:
                radial-gradient(
                    circle at top,
                    #1a1a1a 0%,
                    #0d0d0d 38%,
                    #050505 100%
                );
        }

        .tela-carregando {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle,
                    #171717,
                    #050505
                );

            color: var(--dourado-claro);
            font-size: 18px;
            font-weight: bold;
        }

        header {
            position: relative;
            overflow: hidden;
            padding: 28px 20px;
            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    #111111,
                    #050505
                );

            border-bottom:
                1px solid rgba(212,175,55,0.65);

            box-shadow:
                0 8px 28px rgba(0,0,0,0.45);
        }

        header::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--dourado),
                    var(--prata),
                    var(--dourado),
                    transparent
                );
        }

        header h1 {
            margin: 0;

            background:
                linear-gradient(
                    90deg,
                    var(--dourado-escuro),
                    var(--dourado-claro),
                    #fff1a8,
                    var(--dourado)
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p {
            margin: 8px 0 0;
            color: #d0d0d0;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 28px 20px 45px;
        }

        .caixa,
        .filtro {
            position: relative;
            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    #202020,
                    #111111 58%,
                    #171717
                );

            padding: 22px;
            border-radius: 14px;
            margin-bottom: 20px;

            border: 1px solid #393939;

            box-shadow:
                0 10px 28px rgba(0,0,0,0.35),
                inset 0 1px 0 rgba(255,255,255,0.04);
        }

        .caixa::before,
        .filtro::before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    var(--dourado-escuro),
                    var(--dourado-claro),
                    var(--prata),
                    var(--dourado)
                );
        }

        .caixa h2,
        .filtro h2 {
            color: var(--dourado-claro);
        }

        .caixa p,
        .filtro p {
            color: #c6c6c6;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            margin-bottom: 10px;

            color: #f4f4f4;

            background:
                linear-gradient(
                    180deg,
                    #171717,
                    #101010
                );

            border: 1px solid #454545;
            border-radius: 8px;
            font-size: 16px;
            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: var(--dourado);
            box-shadow:
                0 0 0 3px rgba(212,175,55,0.10);
        }

        .resumo {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            position: relative;
            overflow: hidden;

            background:
                linear-gradient(
                    145deg,
                    #202020,
                    #111111
                );

            padding: 22px;
            border-radius: 12px;
            text-align: center;

            border: 1px solid #3d3d3d;

            box-shadow:
                0 8px 25px rgba(0,0,0,0.32);
        }

        .card h3 {
            margin-top: 0;
            color: #c9c9c9;
            font-size: 16px;
        }

        .valor {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
        }

        .recebido {
            border-top: 4px solid #8ca595;
        }

        .fiado {
            border-top: 4px solid var(--bordo-claro);
        }

        .pagamento-fiado {
            border-top: 4px solid var(--dourado);
        }

        .custo {
            border-top: 4px solid #8f8f8f;
        }

        .lucro {
            border-top: 4px solid var(--dourado-claro);
        }

        .receber {
            border-top: 4px solid #b8892b;
        }

        .produto {
            padding: 11px 0;
            border-bottom: 1px solid #3d3d3d;
            color: #d7d7d7;
        }

        .mesa,
        .fiado-item,
        .pagamento-item {
            background:
                linear-gradient(
                    145deg,
                    #1c1c1c,
                    #101010
                );

            padding: 16px;
            margin-bottom: 11px;
            border-radius: 10px;

            border: 1px solid #393939;
        }

        .mesa {
            border-left: 5px solid #789480;
        }

        .fiado-item {
            border-left: 5px solid var(--bordo-claro);
        }

        .pagamento-item {
            border-left: 5px solid var(--dourado);
        }

        .mesa h3,
        .fiado-item h3,
        .pagamento-item h3 {
            color: var(--dourado-claro);
        }

        .mesa p,
        .fiado-item p,
        .pagamento-item p {
            color: #c6c6c6;
        }

        button {
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            color: white;
            font-size: 15px;
            font-weight: bold;
            margin-top: 5px;
            margin-right: 5px;

            border: 1px solid #555;

            box-shadow:
                0 5px 15px rgba(0,0,0,0.28);

            transition:
                transform 0.2s,
                filter 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            filter: brightness(1.12);
        }

        .voltar {
            background:
                linear-gradient(
                    180deg,
                    #3b3b3b,
                    #1e1e1e
                );

            border-color: #585858;
        }

        .consultar {
            background:
                linear-gradient(
                    180deg,
                    #b89228,
                    #725714
                );

            border-color:
                rgba(240,215,122,0.55);
        }

        .hoje {
            background:
                linear-gradient(
                    180deg,
                    #6d6d6d,
                    #353535
                );

            border-color: #808080;
        }

        .aviso {
            padding: 20px;

            background:
                linear-gradient(
                    145deg,
                    #202020,
                    #111111
                );

            border:
                1px solid #3d3d3d;

            border-radius: 10px;
            text-align: center;
            color: #c8c8c8;
        }

        .erro {
            background:
                linear-gradient(
                    180deg,
                    #471418,
                    #280b0d
                );

            color: #ffd5d7;
            border: 1px solid #79272d;

            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 800px) {

            .resumo {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 18px 14px 35px;
            }

            button {
                width: 100%;
                margin-right: 0;
            }

            header {
                padding: 24px 15px;
            }

        }

    </style>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

</head>

<body>

<div
    id="telaCarregando"
    class="tela-carregando"
>
    🔐 Verificando acesso...
</div>

<header>

    <h1>🥩 Espetinho do Will</h1>

    <p>📊 Fechamento Diário</p>

</header>


<div class="container">


    <button
        class="voltar"
        onclick="voltarMenu()"
    >
        ⬅️ Voltar ao Menu
    </button>


    <div class="filtro">

        <h2>📅 Escolher data</h2>

        <input
            type="date"
            id="dataFechamento"
        >

        <button
            class="consultar"
            onclick="carregarFechamento()"
        >
            🔍 Consultar
        </button>

        <button
            class="hoje"
            onclick="irParaHoje()"
        >
            📅 Hoje
        </button>

    </div>


    <div id="resultado">

        <div class="aviso">

            <p>Carregando fechamento...</p>

        </div>

    </div>


</div>


<script>


/* =====================================================
   LOGIN COM SUPABASE
===================================================== */

async function verificarLogin() {

    try {

        if (!window.supabaseClient) {

            throw new Error(
                "Supabase não carregou."
            );

        }

        var resultado =
            await window.supabaseClient
                .auth
                .getSession();

        if (resultado.error) {

            throw resultado.error;

        }

        var sessao =
            resultado.data.session;

        if (!sessao) {

            window.location.replace(
                "login.html"
            );

            return false;

        }

        return true;

    }

    catch (erro) {

        console.error(
            "Erro ao verificar login:",
            erro
        );

        window.location.replace(
            "login.html"
        );

        return false;

    }

}


/* =====================================================
   FORMATAR MOEDA
===================================================== */

function formatarMoeda(valor) {

    return Number(
        valor || 0
    ).toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );

}


/* =====================================================
   DATA DE HOJE
===================================================== */

function obterDataHojeISO() {

    var agora =
        new Date();


    var ano =
        agora.getFullYear();


    var mes =
        String(
            agora.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    var dia =
        String(
            agora.getDate()
        ).padStart(
            2,
            "0"
        );


    return (
        ano +
        "-" +
        mes +
        "-" +
        dia
    );

}


/* =====================================================
   FORMATAR DATA
===================================================== */

function formatarDataBrasil(dataISO) {

    if (!dataISO) {

        return "-";

    }


    var partes =
        dataISO.split("-");


    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );

}


/* =====================================================
   ESCAPAR HTML
===================================================== */

function escaparHTML(texto) {

    return String(
        texto || ""
    )
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


/* =====================================================
   HOJE
===================================================== */

function irParaHoje() {

    document.getElementById(
        "dataFechamento"
    ).value =
        obterDataHojeISO();


    carregarFechamento();

}


/* =====================================================
   VENDAS DO DIA
===================================================== */

async function carregarVendasDia(data) {

    var resultado =
        await window.supabaseClient
            .from("vendas")
            .select("*")
            .eq(
                "data_venda",
                data
            )
            .order(
                "id",
                {
                    ascending: false
                }
            );


    if (resultado.error) {

        throw resultado.error;

    }


    return resultado.data || [];

}


/* =====================================================
   ITENS DAS VENDAS
===================================================== */

async function carregarItensVenda(vendas) {

    if (
        vendas.length === 0
    ) {

        return [];

    }


    var ids =
        [];


    for (
        var i = 0;
        i < vendas.length;
        i++
    ) {

        ids.push(
            vendas[i].id
        );

    }


    var resultado =
        await window.supabaseClient
            .from("itens_venda")
            .select("*")
            .in(
                "venda_id",
                ids
            );


    if (resultado.error) {

        throw resultado.error;

    }


    return resultado.data || [];

}


/* =====================================================
   FIADOS DO DIA
===================================================== */

async function carregarFiadosDia(data) {

    var resultado =
        await window.supabaseClient
            .from("contas_clientes")
            .select("*")
            .eq(
                "data_consumo_date",
                data
            )
            .order(
                "id",
                {
                    ascending: false
                }
            );


    if (resultado.error) {

        throw resultado.error;

    }


    return resultado.data || [];

}


/* =====================================================
   ITENS FIADOS
===================================================== */

async function carregarItensFiado(fiados) {

    if (
        fiados.length === 0
    ) {

        return [];

    }


    var ids =
        [];


    for (
        var i = 0;
        i < fiados.length;
        i++
    ) {

        ids.push(
            fiados[i].id
        );

    }


    var resultado =
        await window.supabaseClient
            .from("itens_conta_cliente")
            .select("*")
            .in(
                "conta_id",
                ids
            );


    if (resultado.error) {

        throw resultado.error;

    }


    return resultado.data || [];

}


/* =====================================================
   PAGAMENTOS DO DIA
===================================================== */

async function carregarPagamentosDia(data) {

    var resultado =
        await window.supabaseClient
            .from("pagamentos_clientes")
            .select("*")
            .eq(
                "data_pagamento_date",
                data
            )
            .order(
                "id",
                {
                    ascending: false
                }
            );


    if (resultado.error) {

        throw resultado.error;

    }


    return resultado.data || [];

}


/* =====================================================
   CLIENTES
===================================================== */

async function carregarClientes() {

    var resultado =
        await window.supabaseClient
            .from("clientes")
            .select("id,nome");


    if (resultado.error) {

        throw resultado.error;

    }


    return resultado.data || [];

}


/* =====================================================
   TODOS OS FIADOS
===================================================== */

async function carregarTodosFiados() {

    var resultado =
        await window.supabaseClient
            .from("contas_clientes")
            .select("total");


    if (resultado.error) {

        throw resultado.error;

    }


    return resultado.data || [];

}


/* =====================================================
   TODOS PAGAMENTOS
===================================================== */

async function carregarTodosPagamentos() {

    var resultado =
        await window.supabaseClient
            .from("pagamentos_clientes")
            .select("valor");


    if (resultado.error) {

        throw resultado.error;

    }


    return resultado.data || [];

}


/* =====================================================
   NOME CLIENTE
===================================================== */

function obterNomeCliente(
    clienteId,
    clientes
) {

    for (
        var i = 0;
        i < clientes.length;
        i++
    ) {

        if (
            Number(
                clientes[i].id
            )
            ===
            Number(
                clienteId
            )
        ) {

            return clientes[i].nome;

        }

    }


    return "Cliente não encontrado";

}


/* =====================================================
   CARREGAR FECHAMENTO
===================================================== */

async function carregarFechamento() {

    var data =
        document.getElementById(
            "dataFechamento"
        ).value;


    var resultado =
        document.getElementById(
            "resultado"
        );


    if (!data) {

        alert(
            "Escolha uma data."
        );

        return;

    }


    resultado.innerHTML =

        "<div class='aviso'>" +

        "<p>⏳ Carregando fechamento...</p>" +

        "</div>";


    try {


        var dados =
            await Promise.all([

                carregarVendasDia(data),

                carregarFiadosDia(data),

                carregarPagamentosDia(data),

                carregarClientes(),

                carregarTodosFiados(),

                carregarTodosPagamentos()

            ]);


        var vendas =
            dados[0];


        var fiados =
            dados[1];


        var pagamentos =
            dados[2];


        var clientes =
            dados[3];


        var todosFiados =
            dados[4];


        var todosPagamentos =
            dados[5];


        var itensVenda =
            await carregarItensVenda(
                vendas
            );


        var itensFiado =
            await carregarItensFiado(
                fiados
            );



        /* =================================================
           TOTAIS
        ================================================= */

        var totalVendas =
            0;


        var custoVendas =
            0;


        var totalFiado =
            0;


        var custoFiado =
            0;


        var totalPagamentos =
            0;


        var dinheiro =
            0;


        var cartao =
            0;


        var pix =
            0;



        for (
            var i = 0;
            i < vendas.length;
            i++
        ) {

            var venda =
                vendas[i];


            var valor =
                Number(
                    venda.total || 0
                );


            totalVendas +=
                valor;


            custoVendas +=

                Number(
                    venda.custo || 0
                );


            if (
                venda.forma_pagamento ===
                "Dinheiro"
            ) {

                dinheiro +=
                    valor;

            }

            else if (
                venda.forma_pagamento ===
                "Cartão"
            ) {

                cartao +=
                    valor;

            }

            else if (
                venda.forma_pagamento ===
                "PIX"
            ) {

                pix +=
                    valor;

            }

        }



        for (
            var i = 0;
            i < fiados.length;
            i++
        ) {

            totalFiado +=

                Number(
                    fiados[i].total || 0
                );


            custoFiado +=

                Number(
                    fiados[i].custo || 0
                );

        }



        for (
            var i = 0;
            i < pagamentos.length;
            i++
        ) {

            var pagamento =
                pagamentos[i];


            var valor =
                Number(
                    pagamento.valor || 0
                );


            totalPagamentos +=
                valor;


            if (
                pagamento.forma_pagamento ===
                "Dinheiro"
            ) {

                dinheiro +=
                    valor;

            }

            else if (
                pagamento.forma_pagamento ===
                "Cartão"
            ) {

                cartao +=
                    valor;

            }

            else if (
                pagamento.forma_pagamento ===
                "PIX"
            ) {

                pix +=
                    valor;

            }

        }



        var totalConsumido =

            totalVendas +

            totalFiado;


        var totalRecebido =

            totalVendas +

            totalPagamentos;


        var totalCusto =

            custoVendas +

            custoFiado;


        var lucro =

            totalConsumido -

            totalCusto;



        /* =================================================
           TOTAL GERAL A RECEBER
        ================================================= */

        var fiadoGeral =
            0;


        for (
            var i = 0;
            i < todosFiados.length;
            i++
        ) {

            fiadoGeral +=

                Number(
                    todosFiados[i].total || 0
                );

        }


        var pagoGeral =
            0;


        for (
            var i = 0;
            i < todosPagamentos.length;
            i++
        ) {

            pagoGeral +=

                Number(
                    todosPagamentos[i].valor || 0
                );

        }


        var totalAReceber =

            fiadoGeral -

            pagoGeral;


        if (
            totalAReceber < 0
        ) {

            totalAReceber =
                0;

        }



        /* =================================================
           PRODUTOS
        ================================================= */

        var produtosVendidos =
            {};


        for (
            var i = 0;
            i < itensVenda.length;
            i++
        ) {

            var item =
                itensVenda[i];


            var nome =
                item.nome_produto;


            if (
                !produtosVendidos[nome]
            ) {

                produtosVendidos[nome] =
                    0;

            }


            produtosVendidos[nome] +=

                Number(
                    item.quantidade || 0
                );

        }


        for (
            var i = 0;
            i < itensFiado.length;
            i++
        ) {

            var item =
                itensFiado[i];


            var nome =
                item.nome_produto;


            if (
                !produtosVendidos[nome]
            ) {

                produtosVendidos[nome] =
                    0;

            }


            produtosVendidos[nome] +=

                Number(
                    item.quantidade || 0
                );

        }



        /* =================================================
           MONTAR TELA
        ================================================= */

        var html =
            "";


        html +=

            "<div class='caixa'>" +

            "<h2>📊 Fechamento do dia</h2>" +

            "<p><strong>Data:</strong> " +

            formatarDataBrasil(
                data
            ) +

            "</p>" +

            "<p><strong>Mesas pagas:</strong> " +

            vendas.length +

            "</p>" +

            "<p><strong>Contas fiadas lançadas:</strong> " +

            fiados.length +

            "</p>" +

            "</div>";



        html +=

            "<div class='resumo'>" +


            "<div class='card recebido'>" +

            "<h3>💰 Recebido no dia</h3>" +

            "<div class='valor'>" +

            formatarMoeda(
                totalRecebido
            ) +

            "</div>" +

            "</div>" +


            "<div class='card fiado'>" +

            "<h3>👤 Fiado lançado</h3>" +

            "<div class='valor'>" +

            formatarMoeda(
                totalFiado
            ) +

            "</div>" +

            "</div>" +


            "<div class='card pagamento-fiado'>" +

            "<h3>💵 Fiado recebido</h3>" +

            "<div class='valor'>" +

            formatarMoeda(
                totalPagamentos
            ) +

            "</div>" +

            "</div>" +


            "<div class='card custo'>" +

            "<h3>📦 Custo do dia</h3>" +

            "<div class='valor'>" +

            formatarMoeda(
                totalCusto
            ) +

            "</div>" +

            "</div>" +


            "<div class='card lucro'>" +

            "<h3>📈 Lucro sobre consumo</h3>" +

            "<div class='valor'>" +

            formatarMoeda(
                lucro
            ) +

            "</div>" +

            "</div>" +


            "<div class='card receber'>" +

            "<h3>📒 Total geral a receber</h3>" +

            "<div class='valor'>" +

            formatarMoeda(
                totalAReceber
            ) +

            "</div>" +

            "</div>" +


            "</div>";



        html +=

            "<div class='caixa'>" +

            "<h2>💳 Formas de pagamento recebidas</h2>" +

            "<p>💵 Dinheiro: <strong>" +

            formatarMoeda(
                dinheiro
            ) +

            "</strong></p>" +

            "<p>💳 Cartão: <strong>" +

            formatarMoeda(
                cartao
            ) +

            "</strong></p>" +

            "<p>📱 PIX: <strong>" +

            formatarMoeda(
                pix
            ) +

            "</strong></p>" +

            "</div>";



        html +=

            "<div class='caixa'>" +

            "<h2>🧾 Total consumido no dia</h2>" +

            "<p class='valor'>" +

            formatarMoeda(
                totalConsumido
            ) +

            "</p>" +

            "</div>";



        /* =================================================
           PRODUTOS
        ================================================= */

        html +=

            "<div class='caixa'>" +

            "<h2>🥩 Produtos consumidos</h2>";


        var nomes =
            Object.keys(
                produtosVendidos
            );


        if (
            nomes.length === 0
        ) {

            html +=

                "<p>Nenhum produto registrado nesta data.</p>";

        }

        else {

            for (
                var i = 0;
                i < nomes.length;
                i++
            ) {

                html +=

                    "<div class='produto'>" +

                    "🥩 " +

                    escaparHTML(
                        nomes[i]
                    ) +

                    " × " +

                    produtosVendidos[
                        nomes[i]
                    ] +

                    "</div>";

            }

        }


        html +=
            "</div>";



        /* =================================================
           VENDAS
        ================================================= */

        html +=

            "<div class='caixa'>" +

            "<h2>✅ Mesas pagas</h2>";


        if (
            vendas.length === 0
        ) {

            html +=

                "<p>Nenhuma mesa paga nesta data.</p>";

        }


        for (
            var i = 0;
            i < vendas.length;
            i++
        ) {

            var venda =
                vendas[i];


            html +=

                "<div class='mesa'>" +

                "<h3>🍽️ Mesa " +

                escaparHTML(
                    venda.mesa
                ) +

                "</h3>" +

                "<p>Horário: " +

                escaparHTML(
                    venda.horario || "-"
                ) +

                "</p>" +

                "<p>Pagamento: " +

                escaparHTML(
                    venda.forma_pagamento || "-"
                ) +

                "</p>" +

                "<p><strong>Total: " +

                formatarMoeda(
                    venda.total
                ) +

                "</strong></p>" +

                "</div>";

        }


        html +=
            "</div>";



        /* =================================================
           FIADOS
        ================================================= */

        html +=

            "<div class='caixa'>" +

            "<h2>👤 Fiados lançados</h2>";


        if (
            fiados.length === 0
        ) {

            html +=

                "<p>Nenhum fiado lançado nesta data.</p>";

        }


        for (
            var i = 0;
            i < fiados.length;
            i++
        ) {

            var conta =
                fiados[i];


            var nomeCliente =
                obterNomeCliente(

                    conta.cliente_id,

                    clientes

                );


            html +=

                "<div class='fiado-item'>" +

                "<h3>👤 " +

                escaparHTML(
                    nomeCliente
                ) +

                "</h3>" +

                "<p>Mesa: " +

                escaparHTML(
                    conta.mesa || "-"
                ) +

                "</p>" +

                "<p><strong>Valor fiado: " +

                formatarMoeda(
                    conta.total
                ) +

                "</strong></p>" +

                "</div>";

        }


        html +=
            "</div>";



        /* =================================================
           PAGAMENTOS
        ================================================= */

        html +=

            "<div class='caixa'>" +

            "<h2>💵 Pagamentos de clientes</h2>";


        if (
            pagamentos.length === 0
        ) {

            html +=

                "<p>Nenhum pagamento de conta nesta data.</p>";

        }


        for (
            var i = 0;
            i < pagamentos.length;
            i++
        ) {

            var pagamento =
                pagamentos[i];


            var nomeCliente =
                obterNomeCliente(

                    pagamento.cliente_id,

                    clientes

                );


            html +=

                "<div class='pagamento-item'>" +

                "<h3>💰 " +

                escaparHTML(
                    nomeCliente
                ) +

                "</h3>" +

                "<p>Forma: " +

                escaparHTML(
                    pagamento.forma_pagamento || "-"
                ) +

                "</p>" +

                "<p><strong>Recebido: " +

                formatarMoeda(
                    pagamento.valor
                ) +

                "</strong></p>" +

                "</div>";

        }


        html +=
            "</div>";



        resultado.innerHTML =
            html;

    }

    catch (erro) {

        console.error(
            erro
        );


        resultado.innerHTML =

            "<div class='erro'>" +

            "❌ Não foi possível carregar o fechamento." +

            "<br><br>" +

            escaparHTML(
                erro.message ||
                "Erro desconhecido."
            ) +

            "</div>";

    }

}


/* =====================================================
   VOLTAR
===================================================== */

function voltarMenu() {

    window.location.href =
        "index.html";

}


/* =====================================================
   INICIAR
===================================================== */

window.onload =
    async function() {

        var autorizado =
            await verificarLogin();

        if (!autorizado) {

            return;

        }

        document.getElementById(
            "dataFechamento"
        ).value =
            obterDataHojeISO();

        document.getElementById(
            "telaCarregando"
        ).style.display =
            "none";

        await carregarFechamento();

    };


</script>
