<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Estoque - Espetinho do Will</title>

        <style>
        * { box-sizing: border-box; }

        :root {
            --preto: #070707;
            --preto2: #111111;
            --preto3: #1b1b1b;
            --dourado: #d4af37;
            --dourado-claro: #f0d77a;
            --dourado-escuro: #8d6d1c;
            --prata: #d7d7d7;
            --prata2: #8f8f8f;
            --bordo: #7c1d24;
            --bordo-claro: #a52a32;
            --texto: #f4f4f4;
            --texto2: #b7b7b7;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--texto);
            background:
                radial-gradient(circle at top, #1b1b1b 0%, #0d0d0d 38%, #050505 100%);
        }

        .tela-carregando {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle, #171717, #050505);
            color: var(--dourado-claro);
            font-size: 18px;
            font-weight: bold;
        }

        header {
            position: relative;
            overflow: hidden;
            padding: 28px 20px;
            text-align: center;
            background: linear-gradient(145deg, #111, #050505);
            border-bottom: 1px solid rgba(212,175,55,.65);
            box-shadow: 0 8px 28px rgba(0,0,0,.45);
        }

        header::after {
            content: "";
            position: absolute;
            left: 0; right: 0; bottom: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--dourado), var(--prata), var(--dourado), transparent);
        }

        header h1 {
            margin: 0;
            font-size: 30px;
            background: linear-gradient(90deg, var(--dourado-escuro), var(--dourado-claro), #fff1a8, var(--dourado));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        header p { margin: 8px 0 0; color: #d0d0d0; }

        .container {
            max-width: 950px;
            margin: auto;
            padding: 28px 20px 45px;
        }

        .caixa {
            position: relative;
            overflow: hidden;
            background: linear-gradient(145deg, #202020, #111 58%, #171717);
            padding: 22px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid #393939;
            box-shadow: 0 10px 28px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
        }

        .caixa::before {
            content: "";
            position: absolute;
            left: 0; right: 0; top: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--dourado-escuro), var(--dourado-claro), var(--prata), var(--dourado));
        }

        h2 { color: var(--dourado-claro); }
        label { color: #ddd; font-weight: bold; }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 6px;
            margin-bottom: 15px;
            color: #f4f4f4;
            background: linear-gradient(180deg, #171717, #101010);
            border: 1px solid #454545;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: .2s;
        }

        input:focus {
            border-color: var(--dourado);
            box-shadow: 0 0 0 3px rgba(212,175,55,.10);
        }

        input::placeholder { color: #757575; }

        button {
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            border: 1px solid #555;
            color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,.28);
            transition: transform .2s, filter .2s;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            filter: brightness(1.12);
        }

        button:disabled { opacity: .6; cursor: not-allowed; }

        .salvar {
            background: linear-gradient(180deg, #b89228, #725714);
            border-color: rgba(240,215,122,.55);
        }

        .voltar {
            background: linear-gradient(180deg, #3b3b3b, #1e1e1e);
            color: var(--prata);
            border-color: #585858;
            margin-bottom: 20px;
        }

        .produto {
            background: linear-gradient(145deg, #1d1d1d, #101010);
            padding: 19px;
            border-radius: 12px;
            margin-bottom: 14px;
            border: 1px solid #393939;
            box-shadow: 0 7px 22px rgba(0,0,0,.30);
        }

        .produto h3 {
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--dourado-claro);
        }

        .produto p { margin: 6px 0; color: #c4c4c4; }
        .produto strong { color: #eee; }

        .acoes { margin-top: 15px; }

        .editar {
            background: linear-gradient(180deg, #777, #3e3e3e);
            border-color: #8d8d8d;
            margin-right: 5px;
        }

        .excluir {
            background: linear-gradient(180deg, var(--bordo-claro), #4d1015);
            border-color: #8b333a;
        }

        .estoque-baixo { border-left: 5px solid var(--bordo-claro); }
        .estoque-normal { border-left: 5px solid #789480; }

        .vazio, .carregando {
            text-align: center;
            color: #9c9c9c;
            padding: 20px;
        }

        .aviso {
            background: linear-gradient(180deg, #332b16, #1d180c);
            border: 1px solid #655525;
            color: var(--dourado-claro);
            padding: 15px;
            border-radius: 9px;
            margin-bottom: 20px;
        }

        .erro {
            background: linear-gradient(180deg, #471418, #280b0d);
            border: 1px solid #79272d;
            color: #ffd5d7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .sucesso {
            background: linear-gradient(180deg, #193024, #0d1d14);
            border: 1px solid #315944;
            color: #c8ead4;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        @media (max-width: 700px) {
            .container { padding: 18px 14px 35px; }
            header { padding: 24px 15px; }
            header h1 { font-size: 25px; }

            .acoes button {
                width: 100%;
                margin-top: 8px;
                margin-right: 0;
            }

            .salvar, .voltar { width: 100%; }
        }
    </style>

    <!-- BIBLIOTECA SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- NOSSA CONEXÃO COM O SUPABASE -->
    <script src="supabase.js"></script>

</head>


<body>

<div id="telaCarregando" class="tela-carregando">
    🔐 Verificando acesso...
</div>


<!-- CABEÇALHO -->

<header>

    <h1>🥩 Espetinho do Will</h1>

    <p>📦 Controle de Estoque</p>

</header>


<div class="container">


    <button
        class="voltar"
        onclick="voltarMenu()"
    >
        🏠 Voltar ao menu
    </button>


    <!-- =====================================
         MENSAGEM
    ====================================== -->

    <div
        id="mensagem"
        style="display:none;"
    ></div>


    <!-- =====================================
         CADASTRO
    ====================================== -->

    <div class="caixa">

        <h2 id="tituloFormulario">
            ➕ Cadastrar produto
        </h2>


        <label>
            Nome do produto:
        </label>

        <input
            type="text"
            id="nome"
            placeholder="Ex.: Espetinho de carne"
        >


        <label>
            Quantidade em estoque:
        </label>

        <input
            type="number"
            id="quantidade"
            min="0"
            placeholder="Ex.: 50"
        >


        <label>
            Custo do produto:
        </label>

        <input
            type="number"
            id="custo"
            min="0"
            step="0.01"
            placeholder="Ex.: 5.00"
        >


        <label>
            Preço de venda:
        </label>

        <input
            type="number"
            id="venda"
            min="0"
            step="0.01"
            placeholder="Ex.: 10.00"
        >


        <button
            class="salvar"
            id="botaoSalvar"
            onclick="salvarProduto()"
        >
            💾 Salvar produto
        </button>

    </div>


    <!-- =====================================
         AVISO
    ====================================== -->

    <div class="aviso">

        💡 Produtos cadastrados aqui poderão ser
        utilizados na tela de <strong>Pedidos</strong>.

    </div>


    <!-- =====================================
         PRODUTOS
    ====================================== -->

    <h2>📦 Produtos cadastrados</h2>


    <div id="listaProdutos">

        <p class="carregando">
            ⏳ Carregando produtos...
        </p>

    </div>


</div>


<script>


/* =====================================================
   VARIÁVEIS
===================================================== */

var idEditando = null;


/* =====================================================
   LOGIN COM SUPABASE
===================================================== */

async function verificarLogin() {

    try {

        if (!window.supabaseClient) {

            throw new Error(
                "Supabase não carregou."
            );

        }

        var resultado =
            await window.supabaseClient
                .auth
                .getSession();

        if (resultado.error) {

            throw resultado.error;

        }

        var sessao =
            resultado.data.session;

        if (!sessao) {

            window.location.replace(
                "login.html"
            );

            return false;

        }

        return true;

    }

    catch (erro) {

        console.error(
            "Erro ao verificar login:",
            erro
        );

        window.location.replace(
            "login.html"
        );

        return false;

    }

}


/* =====================================================
   VOLTAR AO MENU
===================================================== */

function voltarMenu() {

    window.location.href =
        "index.html";

}


/* =====================================================
   MENSAGEM
===================================================== */

function mostrarMensagem(
    texto,
    tipo
) {

    var mensagem =
        document.getElementById(
            "mensagem"
        );


    mensagem.innerHTML =
        texto;


    mensagem.className =
        tipo;


    mensagem.style.display =
        "block";


    setTimeout(
        function() {

            mensagem.style.display =
                "none";

        },
        3000
    );

}


/* =====================================================
   CARREGAR PRODUTOS DO SUPABASE
===================================================== */

async function carregarProdutos() {

    var lista =
        document.getElementById(
            "listaProdutos"
        );


    lista.innerHTML =
        "<p class='carregando'>⏳ Carregando produtos...</p>";


    try {

        if (!window.supabaseClient) {

            throw new Error(
                "Conexão com o Supabase não encontrada."
            );

        }


        var resultado =
            await window.supabaseClient
                .from("produtos")
                .select("*")
                .order("id", {
                    ascending: true
                });


        if (resultado.error) {

            throw resultado.error;

        }


        mostrarProdutos(
            resultado.data || []
        );

    }

    catch (erro) {

        console.error(
            "Erro ao carregar produtos:",
            erro
        );


        lista.innerHTML =

            "<div class='erro'>" +

            "❌ Não foi possível carregar os produtos." +

            "<br><br>" +

            "Verifique a conexão com o banco de dados." +

            "</div>";

    }

}


/* =====================================================
   MOSTRAR PRODUTOS
===================================================== */

function mostrarProdutos(
    produtos
) {

    var lista =
        document.getElementById(
            "listaProdutos"
        );


    lista.innerHTML = "";


    if (
        produtos.length === 0
    ) {

        lista.innerHTML =

            "<p class='vazio'>" +

            "Nenhum produto cadastrado." +

            "</p>";

        return;

    }


    for (
        var i = 0;
        i < produtos.length;
        i++
    ) {

        var produto =
            produtos[i];


        var quantidade =
            Number(
                produto.quantidade || 0
            );


        var custo =
            Number(
                produto.custo || 0
            );


        var venda =
            Number(
                produto.venda || 0
            );


        var lucro =
            venda - custo;


        var classeEstoque =
            quantidade <= 5
                ? "estoque-baixo"
                : "estoque-normal";


        lista.innerHTML +=

            "<div class='produto " +
            classeEstoque +
            "'>" +


            "<h3>🥩 " +
            escaparHTML(
                produto.nome
            ) +
            "</h3>" +


            "<p>" +

            "<strong>Quantidade:</strong> " +

            quantidade +

            "</p>" +


            "<p>" +

            "<strong>Custo:</strong> R$ " +

            custo.toFixed(2) +

            "</p>" +


            "<p>" +

            "<strong>Venda:</strong> R$ " +

            venda.toFixed(2) +

            "</p>" +


            "<p>" +

            "<strong>Lucro por unidade:</strong> R$ " +

            lucro.toFixed(2) +

            "</p>" +


            (

                quantidade <= 5

                ?

                "<p style='color:#d56a70;font-weight:bold;'>" +

                "⚠️ Estoque baixo" +

                "</p>"

                :

                "<p style='color:#9abb9f;font-weight:bold;'>" +

                "✅ Estoque normal" +

                "</p>"

            ) +


            "<div class='acoes'>" +


            "<button " +

            "class='editar' " +

            "onclick='editarProduto(" +

            JSON.stringify(
                produto.id
            ) +

            ")'>" +

            "✏️ Editar" +

            "</button>" +


            "<button " +

            "class='excluir' " +

            "onclick='excluirProduto(" +

            JSON.stringify(
                produto.id
            ) +

            ")'>" +

            "🗑️ Excluir" +

            "</button>" +


            "</div>" +


            "</div>";

    }

}


/* =====================================================
   ESCAPAR TEXTO
===================================================== */

function escaparHTML(
    texto
) {

    return String(texto || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   SALVAR PRODUTO
===================================================== */

async function salvarProduto() {

    var nome =
        document.getElementById(
            "nome"
        ).value.trim();


    var quantidade =
        Number(
            document.getElementById(
                "quantidade"
            ).value
        );


    var custo =
        Number(
            document.getElementById(
                "custo"
            ).value
        );


    var venda =
        Number(
            document.getElementById(
                "venda"
            ).value
        );


    if (nome === "") {

        alert(
            "Digite o nome do produto."
        );

        return;

    }


    if (
        !Number.isFinite(
            quantidade
        ) ||
        quantidade < 0
    ) {

        alert(
            "Digite uma quantidade válida."
        );

        return;

    }


    if (
        !Number.isFinite(
            custo
        ) ||
        custo < 0
    ) {

        alert(
            "Digite um custo válido."
        );

        return;

    }


    if (
        !Number.isFinite(
            venda
        ) ||
        venda < 0
    ) {

        alert(
            "Digite um preço de venda válido."
        );

        return;

    }


    if (!window.supabaseClient) {

        alert(
            "Erro: conexão com o Supabase não encontrada."
        );

        return;

    }


    var botao =
        document.getElementById(
            "botaoSalvar"
        );


    botao.disabled = true;


    botao.innerText =
        "⏳ Salvando...";


    try {


        /* =================================
           EDITAR
        ================================= */

        if (idEditando !== null) {

            var resultado =
                await window.supabaseClient
                    .from("produtos")
                    .update({

                        nome:
                            nome,

                        quantidade:
                            quantidade,

                        custo:
                            custo,

                        venda:
                            venda

                    })
                    .eq(
                        "id",
                        idEditando
                    );


            if (resultado.error) {

                throw resultado.error;

            }


            mostrarMensagem(
                "✅ Produto atualizado com sucesso!",
                "sucesso"
            );

        }


        /* =================================
           NOVO PRODUTO
        ================================= */

        else {

            var resultado =
                await window.supabaseClient
                    .from("produtos")
                    .insert({

                        nome:
                            nome,

                        quantidade:
                            quantidade,

                        custo:
                            custo,

                        venda:
                            venda

                    });


            if (resultado.error) {

                throw resultado.error;

            }


            mostrarMensagem(
                "✅ Produto cadastrado com sucesso!",
                "sucesso"
            );

        }


        limparFormulario();


        await carregarProdutos();

    }


    catch (erro) {

        console.error(
            "Erro ao salvar produto:",
            erro
        );


        alert(
            "❌ Não foi possível salvar o produto.\n\n" +
            "Erro: " +
            (
                erro.message ||
                "Erro desconhecido."
            )
        );

    }


    finally {

        botao.disabled =
            false;


        botao.innerText =
            "💾 Salvar produto";

    }

}


/* =====================================================
   EDITAR PRODUTO
===================================================== */

async function editarProduto(
    id
) {

    try {

        var resultado =
            await window.supabaseClient
                .from("produtos")
                .select("*")
                .eq(
                    "id",
                    id
                )
                .single();


        if (resultado.error) {

            throw resultado.error;

        }


        var produto =
            resultado.data;


        if (!produto) {

            alert(
                "Produto não encontrado."
            );

            return;

        }


        document.getElementById(
            "nome"
        ).value =
            produto.nome || "";


        document.getElementById(
            "quantidade"
        ).value =
            produto.quantidade || 0;


        document.getElementById(
            "custo"
        ).value =
            produto.custo || 0;


        document.getElementById(
            "venda"
        ).value =
            produto.venda || 0;


        idEditando =
            id;


        document.getElementById(
            "tituloFormulario"
        ).innerText =
            "✏️ Editar produto";


        document.getElementById(
            "botaoSalvar"
        ).innerText =
            "💾 Atualizar produto";


        window.scrollTo({

            top: 0,

            behavior: "smooth"

        });

    }


    catch (erro) {

        console.error(
            erro
        );


        alert(
            "Não foi possível carregar o produto para edição."
        );

    }

}


/* =====================================================
   EXCLUIR PRODUTO
===================================================== */

async function excluirProduto(
    id
) {

    try {

        var resultado =
            await window.supabaseClient
                .from("produtos")
                .select("nome")
                .eq(
                    "id",
                    id
                )
                .single();


        if (resultado.error) {

            throw resultado.error;

        }


        var produto =
            resultado.data;


        if (!produto) {

            alert(
                "Produto não encontrado."
            );

            return;

        }


        var confirmar =
            confirm(

                "Deseja realmente excluir o produto:\n\n" +

                produto.nome +

                "?"

            );


        if (!confirmar) {

            return;

        }


        var exclusao =
            await window.supabaseClient
                .from("produtos")
                .delete()
                .eq(
                    "id",
                    id
                );


        if (exclusao.error) {

            throw exclusao.error;

        }


        mostrarMensagem(
            "🗑️ Produto excluído com sucesso!",
            "sucesso"
        );


        await carregarProdutos();

    }


    catch (erro) {

        console.error(
            "Erro ao excluir:",
            erro
        );


        alert(
            "Não foi possível excluir o produto.\n\n" +
            (
                erro.message ||
                "Erro desconhecido."
            )
        );

    }

}


/* =====================================================
   LIMPAR FORMULÁRIO
===================================================== */

function limparFormulario() {

    document.getElementById(
        "nome"
    ).value = "";


    document.getElementById(
        "quantidade"
    ).value = "";


    document.getElementById(
        "custo"
    ).value = "";


    document.getElementById(
        "venda"
    ).value = "";


    idEditando =
        null;


    document.getElementById(
        "tituloFormulario"
    ).innerText =
        "➕ Cadastrar produto";


    document.getElementById(
        "botaoSalvar"
    ).innerText =
        "💾 Salvar produto";

}


/* =====================================================
   INICIAR
===================================================== */

window.onload =
    async function() {

        var autorizado =
            await verificarLogin();

        if (!autorizado) {

            return;

        }

        document.getElementById(
            "telaCarregando"
        ).style.display =
            "none";

        await carregarProdutos();

    };

</script>


</body>

</html>
